services:
  postgres:
    container_name: averqel-postgres
    image: ankane/pgvector:latest
    restart: always
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${AVERQEL_POSTGRES_USER:?set AVERQEL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AVERQEL_POSTGRES_PASSWORD:?set AVERQEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AVERQEL_POSTGRES_DB:-knowledge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AVERQEL_POSTGRES_USER} -d ${AVERQEL_POSTGRES_DB:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: averqel-redis
    image: redis:7-alpine
    restart: always
    stop_grace_period: 30s
    command: redis-server --requirepass ${AVERQEL_REDIS_PASSWORD:?set AVERQEL_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AVERQEL_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    container_name: averqel-minio
    image: minio/minio:latest
    restart: always
    stop_grace_period: 30s
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AVERQEL_MINIO_ROOT_USER:?set AVERQEL_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${AVERQEL_MINIO_ROOT_PASSWORD:?set AVERQEL_MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    container_name: averqel-clamav
    image: clamav/clamav:1.4.3
    restart: always
    stop_grace_period: 30s
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3:15 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  inference:
    container_name: averqel-inference
    image: ghcr.io/sainibhaowal/averqel-worker:${AVERQEL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        GIT_VERSION: ${AVERQEL_RELEASE_VERSION:-development}
        GIT_SHA: ${AVERQEL_GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${AVERQEL_BUILD_TIMESTAMP:-unknown}
    restart: always
    init: true
    stop_grace_period: 30s
    command: ["./scripts/start_inference.sh"]
    env_file:
      - ${AVERQEL_ENV_FILE:-.env.vps}
    environment:
      AKS_LOCAL_MODELS_ROOT: /app/models
      AKS_LOCAL_INFERENCE_BASE_URL: http://inference:1011
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AKS_MALWARE_SCAN_ENABLED: ${AKS_MALWARE_SCAN_ENABLED:-true}
      AKS_MALWARE_SCAN_REQUIRED: ${AKS_MALWARE_SCAN_REQUIRED:-true}
      AKS_MALWARE_SCAN_HOST: ${AKS_MALWARE_SCAN_HOST:-clamav}
      AKS_MALWARE_SCAN_PORT: ${AKS_MALWARE_SCAN_PORT:-3310}
      AKS_MALWARE_SCAN_TIMEOUT_SECONDS: ${AKS_MALWARE_SCAN_TIMEOUT_SECONDS:-15}
    depends_on:
      clamav:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend
    expose:
      - "1011"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1011/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    container_name: averqel-api
    image: ghcr.io/sainibhaowal/averqel-api:${AVERQEL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_VERSION: ${AVERQEL_RELEASE_VERSION:-development}
        GIT_SHA: ${AVERQEL_GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${AVERQEL_BUILD_TIMESTAMP:-unknown}
    restart: always
    init: true
    stop_grace_period: 30s
    env_file:
      - ${AVERQEL_ENV_FILE:-.env.vps}
    environment:
      AKS_ENV: ${AKS_ENV:-production}
      AKS_API_WORKERS: ${AKS_API_WORKERS:-2}
      AKS_API_LIMIT_CONCURRENCY: ${AKS_API_LIMIT_CONCURRENCY:-200}
      AKS_API_KEEP_ALIVE_SECONDS: ${AKS_API_KEEP_ALIVE_SECONDS:-5}
      AKS_DATABASE_URL: postgresql+psycopg://${AVERQEL_POSTGRES_USER}:${AVERQEL_POSTGRES_PASSWORD}@postgres:5432/${AVERQEL_POSTGRES_DB:-knowledge}
      AKS_REDIS_URL: redis://:${AVERQEL_REDIS_PASSWORD}@redis:6379/0
      AKS_MINIO_ENDPOINT: minio:9000
      AKS_MINIO_ACCESS_KEY: ${AKS_MINIO_ACCESS_KEY:?set AKS_MINIO_ACCESS_KEY}
      AKS_MINIO_SECRET_KEY: ${AKS_MINIO_SECRET_KEY:?set AKS_MINIO_SECRET_KEY}
      AKS_MINIO_SECURE: ${AKS_MINIO_SECURE:-false}
      AKS_MINIO_VERIFY_SSL: ${AKS_MINIO_VERIFY_SSL:-false}
      AKS_MALWARE_SCAN_ENABLED: ${AKS_MALWARE_SCAN_ENABLED:-true}
      AKS_MALWARE_SCAN_REQUIRED: ${AKS_MALWARE_SCAN_REQUIRED:-true}
      AKS_MALWARE_SCAN_HOST: ${AKS_MALWARE_SCAN_HOST:-clamav}
      AKS_MALWARE_SCAN_PORT: ${AKS_MALWARE_SCAN_PORT:-3310}
      AKS_MALWARE_SCAN_TIMEOUT_SECONDS: ${AKS_MALWARE_SCAN_TIMEOUT_SECONDS:-15}
      AKS_CORS_ORIGINS: ${AKS_CORS_ORIGINS:?set AKS_CORS_ORIGINS}
      AKS_JWT_SECRET: ${AKS_JWT_SECRET:?set AKS_JWT_SECRET}
      AKS_REFRESH_TOKEN_HASH_SECRET: ${AKS_REFRESH_TOKEN_HASH_SECRET:?set AKS_REFRESH_TOKEN_HASH_SECRET}
      AKS_REFRESH_COOKIE_SECURE: ${AKS_REFRESH_COOKIE_SECURE:-true}
      AKS_ADMIN_BREAK_GLASS_ENABLED: ${AKS_ADMIN_BREAK_GLASS_ENABLED:-false}
      AKS_PROVIDER_SECRET_BACKEND: ${AKS_PROVIDER_SECRET_BACKEND:-env_keyring}
      AKS_PROVIDER_SECRET_ACTIVE_KID: ${AKS_PROVIDER_SECRET_ACTIVE_KID:-}
      AKS_PROVIDER_SECRET_KEYRING_JSON: ${AKS_PROVIDER_SECRET_KEYRING_JSON:-}
      AKS_PROVIDER_SECRET_AWS_KMS_KEY_ID: ${AKS_PROVIDER_SECRET_AWS_KMS_KEY_ID:-}
      AKS_PROVIDER_SECRET_AWS_KMS_REGION: ${AKS_PROVIDER_SECRET_AWS_KMS_REGION:-}
      AKS_PROVIDER_SECRET_AWS_KMS_ENDPOINT_URL: ${AKS_PROVIDER_SECRET_AWS_KMS_ENDPOINT_URL:-}
      AKS_PROVIDER_SECRET_AUDIT_READS: ${AKS_PROVIDER_SECRET_AUDIT_READS:-true}
      AKS_TOTP_SECRET_ACTIVE_KID: ${AKS_TOTP_SECRET_ACTIVE_KID:-}
      AKS_TOTP_SECRET_KEYRING_JSON: ${AKS_TOTP_SECRET_KEYRING_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      inference:
        condition: service_healthy
    volumes:
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend
    expose:
      - "1000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1000/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - research_renderer

  frontend:
    container_name: averqel-frontend
    image: ghcr.io/sainibhaowal/averqel-frontend:${AVERQEL_IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PROXY_TARGET: http://api:1000
        GIT_VERSION: ${AVERQEL_RELEASE_VERSION:-development}
        GIT_SHA: ${AVERQEL_GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${AVERQEL_BUILD_TIMESTAMP:-unknown}
    restart: always
    init: true
    stop_grace_period: 20s
    environment:
      NEXT_PROXY_TARGET: http://api:1000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "1030"

  worker:
    container_name: averqel-worker
    image: ghcr.io/sainibhaowal/averqel-worker:${AVERQEL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        GIT_VERSION: ${AVERQEL_RELEASE_VERSION:-development}
        GIT_SHA: ${AVERQEL_GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${AVERQEL_BUILD_TIMESTAMP:-unknown}
    restart: always
    init: true
    stop_grace_period: 30s
    env_file:
      - ${AVERQEL_ENV_FILE:-.env.vps}
    environment:
      AKS_ENV: ${AKS_ENV:-production}
      AKS_WORKER_QUEUES: ${AKS_WORKER_QUEUES:-deepspace}
      AKS_WORKER_CONCURRENCY: ${AKS_WORKER_CONCURRENCY:-2}
      AKS_DATABASE_URL: postgresql+psycopg://${AVERQEL_POSTGRES_USER}:${AVERQEL_POSTGRES_PASSWORD}@postgres:5432/${AVERQEL_POSTGRES_DB:-knowledge}
      AKS_REDIS_URL: redis://:${AVERQEL_REDIS_PASSWORD}@redis:6379/0
      AKS_MINIO_ENDPOINT: minio:9000
      AKS_MINIO_ACCESS_KEY: ${AKS_MINIO_ACCESS_KEY:?set AKS_MINIO_ACCESS_KEY}
      AKS_MINIO_SECRET_KEY: ${AKS_MINIO_SECRET_KEY:?set AKS_MINIO_SECRET_KEY}
      AKS_MINIO_SECURE: ${AKS_MINIO_SECURE:-false}
      AKS_MINIO_VERIFY_SSL: ${AKS_MINIO_VERIFY_SSL:-false}
      AKS_MALWARE_SCAN_ENABLED: ${AKS_MALWARE_SCAN_ENABLED:-true}
      AKS_MALWARE_SCAN_REQUIRED: ${AKS_MALWARE_SCAN_REQUIRED:-true}
      AKS_MALWARE_SCAN_HOST: ${AKS_MALWARE_SCAN_HOST:-clamav}
      AKS_MALWARE_SCAN_PORT: ${AKS_MALWARE_SCAN_PORT:-3310}
      AKS_MALWARE_SCAN_TIMEOUT_SECONDS: ${AKS_MALWARE_SCAN_TIMEOUT_SECONDS:-15}
      AKS_JWT_SECRET: ${AKS_JWT_SECRET:?set AKS_JWT_SECRET}
      AKS_REFRESH_TOKEN_HASH_SECRET: ${AKS_REFRESH_TOKEN_HASH_SECRET:?set AKS_REFRESH_TOKEN_HASH_SECRET}
      AKS_ADMIN_BREAK_GLASS_ENABLED: ${AKS_ADMIN_BREAK_GLASS_ENABLED:-false}
      AKS_PROVIDER_SECRET_BACKEND: ${AKS_PROVIDER_SECRET_BACKEND:-env_keyring}
      AKS_PROVIDER_SECRET_ACTIVE_KID: ${AKS_PROVIDER_SECRET_ACTIVE_KID:-}
      AKS_PROVIDER_SECRET_KEYRING_JSON: ${AKS_PROVIDER_SECRET_KEYRING_JSON:-}
      AKS_PROVIDER_SECRET_AWS_KMS_KEY_ID: ${AKS_PROVIDER_SECRET_AWS_KMS_KEY_ID:-}
      AKS_PROVIDER_SECRET_AWS_KMS_REGION: ${AKS_PROVIDER_SECRET_AWS_KMS_REGION:-}
      AKS_PROVIDER_SECRET_AWS_KMS_ENDPOINT_URL: ${AKS_PROVIDER_SECRET_AWS_KMS_ENDPOINT_URL:-}
      AKS_PROVIDER_SECRET_AUDIT_READS: ${AKS_PROVIDER_SECRET_AUDIT_READS:-true}
      AKS_TOTP_SECRET_ACTIVE_KID: ${AKS_TOTP_SECRET_ACTIVE_KID:-}
      AKS_TOTP_SECRET_KEYRING_JSON: ${AKS_TOTP_SECRET_KEYRING_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      inference:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend

  maintenance-worker:
    extends:
      service: worker
    container_name: averqel-maintenance-worker
    environment:
      AKS_WORKER_QUEUES: maintenance
      AKS_WORKER_CONCURRENCY: ${AKS_MAINTENANCE_WORKER_CONCURRENCY:-1}

  mcp-worker:
    extends:
      service: worker
    container_name: averqel-mcp-worker
    environment:
      AKS_WORKER_QUEUES: mcp_catalog
      AKS_WORKER_CONCURRENCY: ${AKS_MCP_WORKER_CONCURRENCY:-2}

  ingestion-worker:
    extends:
      service: worker
    container_name: averqel-ingestion-worker
    environment:
      AKS_WORKER_QUEUES: ingestion_heavy,ingestion_light
      AKS_WORKER_CONCURRENCY: ${AKS_INGESTION_WORKER_CONCURRENCY:-1}

  scheduler:
    container_name: averqel-scheduler
    image: ghcr.io/sainibhaowal/averqel-worker:${AVERQEL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        GIT_VERSION: ${AVERQEL_RELEASE_VERSION:-development}
        GIT_SHA: ${AVERQEL_GIT_SHA:-unknown}
        BUILD_TIMESTAMP: ${AVERQEL_BUILD_TIMESTAMP:-unknown}
    restart: always
    init: true
    stop_grace_period: 30s
    command: ["./scripts/start_scheduler.sh"]
    env_file:
      - ${AVERQEL_ENV_FILE:-.env.vps}
    environment:
      AKS_ENV: ${AKS_ENV:-production}
      AKS_DATABASE_URL: postgresql+psycopg://${AVERQEL_POSTGRES_USER}:${AVERQEL_POSTGRES_PASSWORD}@postgres:5432/${AVERQEL_POSTGRES_DB:-knowledge}
      AKS_REDIS_URL: redis://:${AVERQEL_REDIS_PASSWORD}@redis:6379/0
      AKS_MINIO_ENDPOINT: minio:9000
      AKS_MINIO_ACCESS_KEY: ${AKS_MINIO_ACCESS_KEY:?set AKS_MINIO_ACCESS_KEY}
      AKS_MINIO_SECRET_KEY: ${AKS_MINIO_SECRET_KEY:?set AKS_MINIO_SECRET_KEY}
      AKS_MINIO_SECURE: ${AKS_MINIO_SECURE:-false}
      AKS_MINIO_VERIFY_SSL: ${AKS_MINIO_VERIFY_SSL:-false}
      AKS_MALWARE_SCAN_ENABLED: ${AKS_MALWARE_SCAN_ENABLED:-true}
      AKS_MALWARE_SCAN_REQUIRED: ${AKS_MALWARE_SCAN_REQUIRED:-true}
      AKS_MALWARE_SCAN_HOST: ${AKS_MALWARE_SCAN_HOST:-clamav}
      AKS_MALWARE_SCAN_PORT: ${AKS_MALWARE_SCAN_PORT:-3310}
      AKS_MALWARE_SCAN_TIMEOUT_SECONDS: ${AKS_MALWARE_SCAN_TIMEOUT_SECONDS:-15}
      AKS_JWT_SECRET: ${AKS_JWT_SECRET:?set AKS_JWT_SECRET}
      AKS_REFRESH_TOKEN_HASH_SECRET: ${AKS_REFRESH_TOKEN_HASH_SECRET:?set AKS_REFRESH_TOKEN_HASH_SECRET}
      AKS_CELERY_BEAT_SCHEDULE_FILE: /runtime/backend/cache/celerybeat-schedule
      AKS_ADMIN_BREAK_GLASS_ENABLED: ${AKS_ADMIN_BREAK_GLASS_ENABLED:-false}
      AKS_PROVIDER_SECRET_BACKEND: ${AKS_PROVIDER_SECRET_BACKEND:-env_keyring}
      AKS_PROVIDER_SECRET_ACTIVE_KID: ${AKS_PROVIDER_SECRET_ACTIVE_KID:-}
      AKS_PROVIDER_SECRET_KEYRING_JSON: ${AKS_PROVIDER_SECRET_KEYRING_JSON:-}
      AKS_PROVIDER_SECRET_AWS_KMS_KEY_ID: ${AKS_PROVIDER_SECRET_AWS_KMS_KEY_ID:-}
      AKS_PROVIDER_SECRET_AWS_KMS_REGION: ${AKS_PROVIDER_SECRET_AWS_KMS_REGION:-}
      AKS_PROVIDER_SECRET_AWS_KMS_ENDPOINT_URL: ${AKS_PROVIDER_SECRET_AWS_KMS_ENDPOINT_URL:-}
      AKS_PROVIDER_SECRET_AUDIT_READS: ${AKS_PROVIDER_SECRET_AUDIT_READS:-true}
      AKS_TOTP_SECRET_ACTIVE_KID: ${AKS_TOTP_SECRET_ACTIVE_KID:-}
      AKS_TOTP_SECRET_KEYRING_JSON: ${AKS_TOTP_SECRET_KEYRING_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      inference:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend

  searxng:
    container_name: averqel-searxng
    image: docker.io/searxng/searxng:latest
    restart: always
    stop_grace_period: 20s
    environment:
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_SECRET: ${SEARXNG_SECRET:-replace-with-a-random-searxng-secret}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    expose:
      - "8080"

  # Optional JavaScript-page rendering. This profile is deliberately separate
  # from the application network: Chromium has no direct route to application
  # services or the public Internet. Its only browser egress is Squid, which
  # rejects internal, link-local, and private destinations.
  research-renderer:
    container_name: averqel-research-renderer
    profiles: ["research-browser"]
    build:
      context: ./research-renderer
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      PORT: "3010"
      RESEARCH_RENDERER_TOKEN: ${AKS_DEEPSPACE_RESEARCH_BROWSER_TOKEN:-}
      RESEARCH_EGRESS_PROXY: http://research-egress-proxy:3128
    expose:
      - "3010"
    networks:
      - research_renderer
    depends_on:
      research-egress-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://0.0.0.0:3010/').then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  research-egress-proxy:
    container_name: averqel-research-egress-proxy
    profiles: ["research-browser"]
    image: ubuntu/squid:latest
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    tmpfs:
      - /var/spool/squid:size=64m,mode=1777
      - /var/log/squid:size=32m,mode=1777
      - /run:size=8m,mode=1777
    volumes:
      - ./research-renderer/squid.conf:/etc/squid/squid.conf:ro
    expose:
      - "3128"
    networks:
      - research_renderer
      - research_egress

volumes:
  postgres_data:
  redis_data:
  minio_data:
  searxng_cache:

networks:
  research_renderer:
    internal: true
  research_egress:
