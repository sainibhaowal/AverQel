services:
  postgres:
    container_name: averqel-postgres
    image: ankane/pgvector:latest
    restart: always
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${AVERQEL_POSTGRES_USER:?set AVERQEL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AVERQEL_POSTGRES_PASSWORD:?set AVERQEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AVERQEL_POSTGRES_DB:-knowledge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${AVERQEL_LOCAL_POSTGRES_PORT:-1005}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AVERQEL_POSTGRES_USER} -d ${AVERQEL_POSTGRES_DB:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: averqel-redis
    image: redis:7-alpine
    restart: always
    stop_grace_period: 30s
    command: redis-server --requirepass ${AVERQEL_REDIS_PASSWORD:?set AVERQEL_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${AVERQEL_LOCAL_REDIS_PORT:-1010}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AVERQEL_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    container_name: averqel-minio
    image: minio/minio:latest
    restart: always
    stop_grace_period: 30s
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AVERQEL_MINIO_ROOT_USER:?set AVERQEL_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${AVERQEL_MINIO_ROOT_PASSWORD:?set AVERQEL_MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${AVERQEL_LOCAL_MINIO_API_PORT:-1015}:9000"
      - "${AVERQEL_LOCAL_MINIO_CONSOLE_PORT:-1020}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    container_name: averqel-clamav
    image: clamav/clamav:1.4.3
    restart: always
    stop_grace_period: 30s
    expose:
      - "3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3:15 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  api:
    container_name: averqel-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    init: true
    stop_grace_period: 30s
    env_file:
      - .env.localprod
    environment:
      AKS_ENV: ${AKS_ENV:-development}
      AKS_API_WORKERS: ${AKS_API_WORKERS:-2}
      AKS_API_LIMIT_CONCURRENCY: ${AKS_API_LIMIT_CONCURRENCY:-100}
      AKS_API_KEEP_ALIVE_SECONDS: ${AKS_API_KEEP_ALIVE_SECONDS:-5}
      AKS_DATABASE_URL: postgresql+psycopg://${AVERQEL_POSTGRES_USER}:${AVERQEL_POSTGRES_PASSWORD}@postgres:5432/${AVERQEL_POSTGRES_DB:-knowledge}
      AKS_REDIS_URL: redis://:${AVERQEL_REDIS_PASSWORD}@redis:6379/0
      AKS_MINIO_ENDPOINT: minio:9000
      AKS_MINIO_ACCESS_KEY: ${AKS_MINIO_ACCESS_KEY:?set AKS_MINIO_ACCESS_KEY}
      AKS_MINIO_SECRET_KEY: ${AKS_MINIO_SECRET_KEY:?set AKS_MINIO_SECRET_KEY}
      AKS_MINIO_SECURE: ${AKS_MINIO_SECURE:-false}
      AKS_MINIO_VERIFY_SSL: ${AKS_MINIO_VERIFY_SSL:-false}
      AKS_MALWARE_SCAN_ENABLED: ${AKS_MALWARE_SCAN_ENABLED:-true}
      AKS_MALWARE_SCAN_REQUIRED: ${AKS_MALWARE_SCAN_REQUIRED:-false}
      AKS_MALWARE_SCAN_HOST: ${AKS_MALWARE_SCAN_HOST:-clamav}
      AKS_MALWARE_SCAN_PORT: ${AKS_MALWARE_SCAN_PORT:-3310}
      AKS_MALWARE_SCAN_TIMEOUT_SECONDS: ${AKS_MALWARE_SCAN_TIMEOUT_SECONDS:-15}
      AKS_CORS_ORIGINS: ${AKS_CORS_ORIGINS:-["http://localhost:1030"]}
      AKS_JWT_SECRET: ${AKS_JWT_SECRET:?set AKS_JWT_SECRET}
      AKS_REFRESH_TOKEN_HASH_SECRET: ${AKS_REFRESH_TOKEN_HASH_SECRET:?set AKS_REFRESH_TOKEN_HASH_SECRET}
      AKS_REFRESH_COOKIE_SECURE: ${AKS_REFRESH_COOKIE_SECURE:-false}
      AKS_PROVIDER_SECRET_ACTIVE_KID: ${AKS_PROVIDER_SECRET_ACTIVE_KID:?set AKS_PROVIDER_SECRET_ACTIVE_KID}
      AKS_PROVIDER_SECRET_KEYRING_JSON: ${AKS_PROVIDER_SECRET_KEYRING_JSON:?set AKS_PROVIDER_SECRET_KEYRING_JSON}
      AKS_TOTP_SECRET_ACTIVE_KID: ${AKS_TOTP_SECRET_ACTIVE_KID:-}
      AKS_TOTP_SECRET_KEYRING_JSON: ${AKS_TOTP_SECRET_KEYRING_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      inference:
        condition: service_healthy
    ports:
      - "1000:1000"
    expose:
      - "1000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1000/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  inference:
    container_name: averqel-inference
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    init: true
    stop_grace_period: 30s
    command: ["./scripts/start_inference.sh"]
    env_file:
      - .env.localprod
    environment:
      AKS_LOCAL_MODELS_ROOT: /app/models
      AKS_LOCAL_INFERENCE_BASE_URL: http://inference:1011
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./app:/app/app
      - ./models:/app/models:ro
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend
    expose:
      - "1011"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1011/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    container_name: averqel-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PROXY_TARGET: http://api:1000
    restart: always
    init: true
    stop_grace_period: 20s
    environment:
      NEXT_PROXY_TARGET: http://api:1000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "1030:1030"
    expose:
      - "1030"

  worker:
    container_name: averqel-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    init: true
    stop_grace_period: 30s
    env_file:
      - .env.localprod
    environment:
      AKS_ENV: ${AKS_ENV:-development}
      AKS_WORKER_QUEUES: ${AKS_WORKER_QUEUES:-deepspace}
      AKS_WORKER_CONCURRENCY: ${AKS_WORKER_CONCURRENCY:-2}
      AKS_DATABASE_URL: postgresql+psycopg://${AVERQEL_POSTGRES_USER}:${AVERQEL_POSTGRES_PASSWORD}@postgres:5432/${AVERQEL_POSTGRES_DB:-knowledge}
      AKS_REDIS_URL: redis://:${AVERQEL_REDIS_PASSWORD}@redis:6379/0
      AKS_MINIO_ENDPOINT: minio:9000
      AKS_MINIO_ACCESS_KEY: ${AKS_MINIO_ACCESS_KEY:?set AKS_MINIO_ACCESS_KEY}
      AKS_MINIO_SECRET_KEY: ${AKS_MINIO_SECRET_KEY:?set AKS_MINIO_SECRET_KEY}
      AKS_MINIO_SECURE: ${AKS_MINIO_SECURE:-false}
      AKS_MINIO_VERIFY_SSL: ${AKS_MINIO_VERIFY_SSL:-false}
      AKS_MALWARE_SCAN_ENABLED: ${AKS_MALWARE_SCAN_ENABLED:-true}
      AKS_MALWARE_SCAN_REQUIRED: ${AKS_MALWARE_SCAN_REQUIRED:-false}
      AKS_MALWARE_SCAN_HOST: ${AKS_MALWARE_SCAN_HOST:-clamav}
      AKS_MALWARE_SCAN_PORT: ${AKS_MALWARE_SCAN_PORT:-3310}
      AKS_MALWARE_SCAN_TIMEOUT_SECONDS: ${AKS_MALWARE_SCAN_TIMEOUT_SECONDS:-15}
      AKS_JWT_SECRET: ${AKS_JWT_SECRET:?set AKS_JWT_SECRET}
      AKS_REFRESH_TOKEN_HASH_SECRET: ${AKS_REFRESH_TOKEN_HASH_SECRET:?set AKS_REFRESH_TOKEN_HASH_SECRET}
      AKS_PROVIDER_SECRET_ACTIVE_KID: ${AKS_PROVIDER_SECRET_ACTIVE_KID:?set AKS_PROVIDER_SECRET_ACTIVE_KID}
      AKS_PROVIDER_SECRET_KEYRING_JSON: ${AKS_PROVIDER_SECRET_KEYRING_JSON:?set AKS_PROVIDER_SECRET_KEYRING_JSON}
      AKS_TOTP_SECRET_ACTIVE_KID: ${AKS_TOTP_SECRET_ACTIVE_KID:-}
      AKS_TOTP_SECRET_KEYRING_JSON: ${AKS_TOTP_SECRET_KEYRING_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      inference:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  maintenance-worker:
    extends:
      service: worker
    container_name: averqel-maintenance-worker
    environment:
      AKS_WORKER_QUEUES: maintenance
      AKS_WORKER_CONCURRENCY: ${AKS_MAINTENANCE_WORKER_CONCURRENCY:-1}

  mcp-worker:
    extends:
      service: worker
    container_name: averqel-mcp-worker
    environment:
      AKS_WORKER_QUEUES: mcp_catalog
      AKS_WORKER_CONCURRENCY: ${AKS_MCP_WORKER_CONCURRENCY:-2}

  ingestion-worker:
    extends:
      service: worker
    container_name: averqel-ingestion-worker
    environment:
      AKS_WORKER_QUEUES: ingestion_heavy,ingestion_light
      AKS_WORKER_CONCURRENCY: ${AKS_INGESTION_WORKER_CONCURRENCY:-1}

  scheduler:
    container_name: averqel-scheduler
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    init: true
    stop_grace_period: 30s
    command: ["./scripts/start_scheduler.sh"]
    env_file:
      - .env.localprod
    environment:
      AKS_ENV: ${AKS_ENV:-development}
      AKS_DATABASE_URL: postgresql+psycopg://${AVERQEL_POSTGRES_USER}:${AVERQEL_POSTGRES_PASSWORD}@postgres:5432/${AVERQEL_POSTGRES_DB:-knowledge}
      AKS_REDIS_URL: redis://:${AVERQEL_REDIS_PASSWORD}@redis:6379/0
      AKS_MINIO_ENDPOINT: minio:9000
      AKS_MINIO_ACCESS_KEY: ${AKS_MINIO_ACCESS_KEY:?set AKS_MINIO_ACCESS_KEY}
      AKS_MINIO_SECRET_KEY: ${AKS_MINIO_SECRET_KEY:?set AKS_MINIO_SECRET_KEY}
      AKS_MINIO_SECURE: ${AKS_MINIO_SECURE:-false}
      AKS_MINIO_VERIFY_SSL: ${AKS_MINIO_VERIFY_SSL:-false}
      AKS_JWT_SECRET: ${AKS_JWT_SECRET:?set AKS_JWT_SECRET}
      AKS_REFRESH_TOKEN_HASH_SECRET: ${AKS_REFRESH_TOKEN_HASH_SECRET:?set AKS_REFRESH_TOKEN_HASH_SECRET}
      AKS_CELERY_BEAT_SCHEDULE_FILE: /runtime/backend/cache/celerybeat-schedule
      AKS_PROVIDER_SECRET_ACTIVE_KID: ${AKS_PROVIDER_SECRET_ACTIVE_KID:?set AKS_PROVIDER_SECRET_ACTIVE_KID}
      AKS_PROVIDER_SECRET_KEYRING_JSON: ${AKS_PROVIDER_SECRET_KEYRING_JSON:?set AKS_PROVIDER_SECRET_KEYRING_JSON}
      AKS_TOTP_SECRET_ACTIVE_KID: ${AKS_TOTP_SECRET_ACTIVE_KID:-}
      AKS_TOTP_SECRET_KEYRING_JSON: ${AKS_TOTP_SECRET_KEYRING_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      inference:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ${AVERQEL_BACKEND_RUNTIME_DIR:-../runtime/backend}:/runtime/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    container_name: averqel-searxng
    image: docker.io/searxng/searxng:latest
    restart: always
    stop_grace_period: 20s
    environment:
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_SECRET: ${SEARXNG_SECRET:-averqel-local-searxng-secret-change-in-production}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    expose:
      - "8080"

  caddy:
    container_name: averqel-caddy
    image: caddy:2-alpine
    restart: always
    stop_grace_period: 20s
    environment:
      AVERQEL_DOMAIN: ${AVERQEL_DOMAIN:-averqel.localhost}
    volumes:
      - ${AVERQEL_CADDYFILE:-./ops/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${AVERQEL_TLS_CERTS_DIR:-../runtime/backend/certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  searxng_cache:
