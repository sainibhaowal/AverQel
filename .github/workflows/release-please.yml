name: Release Please - Auto decide version from commits

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Uses Conventional Commits to decide:
          # fix: -> patch v1.0.0 -> v1.0.1
          # feat: -> minor v1.0.1 -> v1.1.0
          # BREAKING CHANGE: or feat!: -> major v1.1.0 -> v2.0.0

      # Optional: show what would be released (for debugging)
      - name: Show release outputs
        if: always()
        run: |
          echo "releases_created=${{ steps.release.outputs.releases_created }}"
          echo "paths_released=${{ steps.release.outputs.paths_released }}"
          echo "tag_name=${{ steps.release.outputs.tag_name }}"
          echo "version=${{ steps.release.outputs.version }}"
          echo "pr=${{ steps.release.outputs.pr }}"
          echo "prs_created=${{ steps.release.outputs.prs_created }}"
