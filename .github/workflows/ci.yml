name: CI - Mandatory Quality Gates

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 1000 --retries 10 -r requirements.txt -r requirements-dev.txt
          pip install bandit safety

      - name: Ruff check
        run: ruff check .

      - name: Ruff check --fix (no diff allowed)
        run: |
          ruff check . --fix
          if ! git diff --exit-code; then
            echo "::error::ruff --fix produced changes - please run 'ruff check . --fix' locally and commit"
            git diff
            exit 1
          fi

      - name: Black --check
        run: black --check .

      - name: Black format verify (no diff)
        run: |
          black .
          if ! git diff --exit-code; then
            echo "::error::black produced changes - please run 'black .' locally and commit"
            git diff
            exit 1
          fi

      - name: Mypy strict
        run: mypy .

      - name: Bandit security
        run: bandit -r app -q --severity-level medium

      - name: Pip-audit (blocking; one documented compatibility exception)
        run: pip-audit -s osv --ignore-vuln GHSA-xf7x-x43h-rpqh -r requirements.txt -r requirements-dev.txt

      - name: Safety check (blocking)
        run: safety check --full-report

      - name: Pytest (unit_no_db only - fast, no DB)
        run: pytest -q -m unit_no_db --dist=loadgroup

  frontend-quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Typecheck (next build)
        run: pnpm build

      - name: Vitest
        run: pnpm test

  # Single gate for release workflows to depend on
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: always()
    steps:
      - name: Check all gates
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ]; then
            echo "::error::Backend gates failed"
            exit 1
          fi
          if [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "::error::Frontend gates failed"
            exit 1
          fi
          echo "All quality gates passed - safe to build images"
