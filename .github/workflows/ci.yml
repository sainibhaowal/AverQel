name: CI - Mandatory Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/validate-conventional-pr-title.sh "$PR_TITLE"

  backend-quality:
    if: always()
    needs: validate-pr
    name: Backend quality gates (parallel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-compile --prefer-binary --timeout 1000 --retries 10 -r requirements.txt -r requirements-dev.txt
          pip install --no-compile --prefer-binary bandit
          python -m venv "$RUNNER_TEMP/safety-venv"
          "$RUNNER_TEMP/safety-venv/bin/pip" install --no-compile --prefer-binary safety==3.8.1

      - name: Run backend quality and security gates in parallel
        run: |
          set -euo pipefail
          LOG_DIR="$(mktemp -d)"
          declare -A PIDS
          GATES=(ruff black mypy bandit pip-audit safety pytest)

          # These checks only read the checkout. The old ruff-fix and
          # black-format matrix entries were duplicate mutation checks; ruff
          # and black --check provide the same blocking guarantee without
          # racing on one shared working tree.
          for gate in "${GATES[@]}"; do
            (
              if [[ "$gate" == safety ]]; then
                export PATH="$RUNNER_TEMP/safety-venv/bin:$PATH"
              fi
              bash "$GITHUB_WORKSPACE/.github/scripts/run-backend-gate.sh" "$gate"
            ) >"$LOG_DIR/$gate.log" 2>&1 &
            PIDS["$gate"]=$!
          done

          exit_code=0
          for gate in "${GATES[@]}"; do
            gate_code=0
            wait "${PIDS[$gate]}" || gate_code=$?
            cat "$LOG_DIR/$gate.log"
            if (( gate_code != 0 )); then
              echo "::error::Backend gate failed: $gate (exit $gate_code)"
              exit_code=1
            fi
          done
          exit "$exit_code"

  frontend-quality:
    if: always()
    needs: validate-pr
    name: Frontend quality gates (parallel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop test dependencies
        run: pnpm --dir ../applications/desktop install --frozen-lockfile --ignore-scripts

      - name: Run desktop source-resolution tests
        run: |
          pnpm --dir ../applications/desktop prepare:brand-assets
          pnpm --dir ../applications/desktop test

      - name: Run frontend quality and security gates in parallel
        run: |
          set -euo pipefail
          LOG_DIR="$(mktemp -d)"

          # Run the lightweight read-only checks together first. If either
          # fails, stop early instead of spending runner time on a build.
          pnpm lint >"$LOG_DIR/eslint.log" 2>&1 &
          ESLINT_PID=$!
          pnpm audit --prod --audit-level high >"$LOG_DIR/pnpm-audit.log" 2>&1 &
          AUDIT_PID=$!
          ESLINT_STATUS=0
          AUDIT_STATUS=0
          wait "$ESLINT_PID" || ESLINT_STATUS=$?
          wait "$AUDIT_PID" || AUDIT_STATUS=$?
          cat "$LOG_DIR/eslint.log" "$LOG_DIR/pnpm-audit.log"
          if (( ESLINT_STATUS != 0 || AUDIT_STATUS != 0 )); then
            echo "::error::Frontend lint or security audit failed (eslint=$ESLINT_STATUS audit=$AUDIT_STATUS)"
            exit 1
          fi

          # Build and unit tests are independent, but limiting concurrency to
          # these two heavy processes avoids exhausting a GitHub-hosted runner.
          pnpm build >"$LOG_DIR/build.log" 2>&1 &
          BUILD_PID=$!
          pnpm test >"$LOG_DIR/vitest.log" 2>&1 &
          VITEST_PID=$!
          BUILD_STATUS=0
          VITEST_STATUS=0
          wait "$BUILD_PID" || BUILD_STATUS=$?
          wait "$VITEST_PID" || VITEST_STATUS=$?
          cat "$LOG_DIR/build.log" "$LOG_DIR/vitest.log"
          if (( BUILD_STATUS != 0 || VITEST_STATUS != 0 )); then
            echo "::error::Frontend build or tests failed (build=$BUILD_STATUS vitest=$VITEST_STATUS)"
            exit 1
          fi

  frontend-e2e:
    if: always()
    needs: validate-pr
    name: Frontend Playwright E2E (isolated)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated browser workflows
        env:
          CI: "1"
        run: pnpm e2e

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn

  backend-isolated:
    if: always()
    needs: validate-pr
    name: Backend integration and E2E (isolated services)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run disposable PostgreSQL, Redis, and MinIO test stack
        env:
          AKS_TEST_XDIST_MAX_WORKERS: "2"
        run: >-
          ./backend/scripts/test-isolated.sh
          tests/integration tests/security tests/e2e -n 2

  backend-provider-and-performance:
    if: always()
    needs: validate-pr
    name: Provider contract and benchmark smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-compile --prefer-binary --timeout 1000 --retries 10 \
            -r requirements.txt -r requirements-dev.txt

      - name: Run provider matrix and offline benchmark checks
        run: >-
          python scripts/staging_durable_load.py --dry-run --provider-mode mock &&
          pytest -q -m unit_no_db
          tests/unit/test_provider_registry_matrix.py
          tests/unit/test_lmstudio_provider.py
          tests/unit/test_ollama_provider.py
          tests/unit/test_local_desktop_provider.py
          tests/performance

  deployment-validation:
    name: Deployment manifest validation (no services started)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production and isolated compose manifests
        run: bash backend/scripts/validate_deployment_config.sh

  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test isolated pre-push gate
        run: bash .github/scripts/tests/test-pre-push-checks.sh

      - name: Test semantic release version calculation
        run: bash .github/scripts/tests/test-next-semver.sh

      - name: Test Conventional Commit PR title validation
        run: bash .github/scripts/tests/test-conventional-pr-title.sh

      - name: Validate all GitHub Actions workflows with Actionlint
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          rhysd/actionlint:1.7.12
          -color

  # This is the only required check configured for protected main.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      [
        validate-pr,
        backend-quality,
        frontend-quality,
        frontend-e2e,
        backend-isolated,
        backend-provider-and-performance,
        deployment-validation,
        workflow-lint,
      ]
    if: always()
    steps:
      - name: Check every quality gate
        env:
          VALIDATE_PR_RESULT: ${{ needs.validate-pr.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          BROWSER_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          BACKEND_ISOLATED_RESULT: ${{ needs.backend-isolated.result }}
          PROVIDER_PERF_RESULT: ${{ needs.backend-provider-and-performance.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-validation.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          set -euo pipefail

          if [[ "$VALIDATE_PR_RESULT" != "success" ]]; then
            echo "::error::PR validation failed"
            exit 1
          fi

          if [[ "$WORKFLOW_LINT_RESULT" != "success" ]]; then
            echo "::error::GitHub Actions workflow lint failed"
            exit 1
          fi

          if [[ "$BACKEND_RESULT" != "success" ]]; then
            echo "::error::Backend gates failed"
            exit 1
          fi

          if [[ "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Frontend gates failed"
            exit 1
          fi

          if [[ "$BROWSER_E2E_RESULT" != "success" ]]; then
            echo "::error::Frontend browser E2E failed"
            exit 1
          fi

          if [[ "$BACKEND_ISOLATED_RESULT" != "success" ]]; then
            echo "::error::Isolated backend integration/E2E gates failed"
            exit 1
          fi

          if [[ "$PROVIDER_PERF_RESULT" != "success" ]]; then
            echo "::error::Provider or performance smoke gates failed"
            exit 1
          fi

          if [[ "$DEPLOYMENT_RESULT" != "success" ]]; then
            echo "::error::Deployment manifest validation failed"
            exit 1
          fi

          echo "All quality gates passed."
