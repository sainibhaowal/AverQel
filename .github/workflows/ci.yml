name: CI - Mandatory Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      run_backend: ${{ steps.decide.outputs.run_backend }}
      run_frontend: ${{ steps.decide.outputs.run_frontend }}
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - name: Detect PR paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/docs/**'
              - '!backend/**/*.md'
              - '!backend/**/*.mdx'
            frontend:
              - 'frontend/**'
              - '!frontend/docs/**'
              - '!frontend/**/*.md'
              - '!frontend/**/*.mdx'
            full:
              # Dependency and build inputs can affect either application.
              - '**/requirements*.txt'
              - '**/pyproject.toml'
              - '**/poetry.lock'
              - '**/uv.lock'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '**/*.Dockerfile'
              - '**/docker-compose*.yml'
              - '**/docker-compose*.yaml'
              # CI/CD and shared automation changes are full validation changes.
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.pre-commit-config.yaml'
              - '**/migrations/**'
              - '**/migration/**'
              - '**/alembic/**'
              - '**/*.sql'
              - '**/config/**'
              - 'pyproject.toml'
              - 'ruff.toml'
              - 'mypy.ini'
              - 'frontend/tsconfig*.json'
              - 'frontend/eslint.config.*'
              - 'frontend/vite.config.*'
              - 'frontend/vitest.config.*'
              - 'frontend/next.config.*'
              - 'frontend/tailwind.config.*'
              - 'frontend/postcss.config.*'
            docs:
              - '**/*.md'
              - '**/*.mdx'
              - 'docs/**'
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - '.github/ISSUE_TEMPLATE/**'

      - name: Decide applicable quality suites
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          FULL_CHANGED: ${{ steps.filter.outputs.full }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs }}
        run: |
          set -euo pipefail

          # Manual runs are explicit full validation runs.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            run_backend=true
            run_frontend=true
            docs_only=false
          else
            run_backend=false
            run_frontend=false

            if [[ "$BACKEND_CHANGED" == "true" ]]; then
              run_backend=true
            fi
            if [[ "$FRONTEND_CHANGED" == "true" ]]; then
              run_frontend=true
            fi
            if [[ "$FULL_CHANGED" == "true" ]]; then
              run_backend=true
              run_frontend=true
            fi

            docs_only=false
            if [[ "$DOCS_CHANGED" == "true" && "$run_backend" == "false" && "$run_frontend" == "false" ]]; then
              docs_only=true
            fi
          fi

          echo "run_backend=$run_backend" >> "$GITHUB_OUTPUT"
          echo "run_frontend=$run_frontend" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Backend checks: $run_backend"
          echo "Frontend checks: $run_frontend"
          echo "Documentation only: $docs_only"

  backend-quality:
    if: needs.changes.outputs.run_backend == 'true'
    needs: changes
    name: Backend - ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - ruff
          - ruff-fix
          - black
          - black-format
          - mypy
          - bandit
          - pip-audit
          - safety
          - pytest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-compile --prefer-binary --timeout 1000 --retries 10 -r requirements.txt -r requirements-dev.txt
          pip install --no-compile --prefer-binary bandit safety

      - name: Run backend gate
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-backend-gate.sh" "${{ matrix.gate }}"

  frontend-quality:
    if: needs.changes.outputs.run_frontend == 'true'
    needs: changes
    name: Frontend - ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [eslint, build, vitest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        if: matrix.gate == 'eslint'
        run: pnpm lint

      - name: Typecheck and build
        if: matrix.gate == 'build'
        run: pnpm build

      - name: Vitest
        if: matrix.gate == 'vitest'
        run: pnpm test

  # This is the only required check configured for protected main.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [changes, backend-quality, frontend-quality]
    if: always()
    steps:
      - name: Check applicable gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          RUN_BACKEND: ${{ needs.changes.outputs.run_backend }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::Change classification failed"
            exit 1
          fi

          if [[ "$RUN_BACKEND" == "true" && "$BACKEND_RESULT" != "success" ]]; then
            echo "::error::Backend gates failed"
            exit 1
          fi

          if [[ "$RUN_FRONTEND" == "true" && "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Frontend gates failed"
            exit 1
          fi

          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Documentation-only change: heavy quality suites were not required."
          fi
          echo "All applicable quality gates passed."
