name: CI - Mandatory Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent overlapping runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 1000 --retries 10 -r requirements.txt -r requirements-dev.txt
          pip install bandit safety

      - name: Parallel backend quality and security gates
        run: |
          set -uo pipefail

          declare -A GATE_PIDS
          GATES=(ruff black mypy bandit pip-audit safety pytest)

          start_gate() {
            local name="$1"
            shift
            echo "Starting $name"
            "$@" >"gate-${name}.log" 2>&1 &
            GATE_PIDS["$name"]=$!
          }

          start_gate ruff ruff check .
          start_gate black black --check .
          start_gate mypy mypy .
          start_gate bandit bandit -r app -q --severity-level medium
          start_gate pip-audit pip-audit -s osv --ignore-vuln GHSA-xf7x-x43h-rpqh -r requirements.txt -r requirements-dev.txt
          start_gate safety safety check --full-report
          start_gate pytest pytest -q -m unit_no_db --dist=loadgroup

          exit_code=0
          for name in "${GATES[@]}"; do
            if wait "${GATE_PIDS[$name]}"; then
              echo "PASS: $name"
            else
              code=$?
              echo "FAIL: $name (exit $code)"
              cat "gate-${name}.log"
              exit_code=1
            fi
          done
          exit "$exit_code"

  frontend-quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Parallel frontend quality gates
        run: |
          set -uo pipefail

          declare -A GATE_PIDS
          GATES=(eslint build vitest)

          start_gate() {
            local name="$1"
            shift
            echo "Starting $name"
            "$@" >"gate-${name}.log" 2>&1 &
            GATE_PIDS["$name"]=$!
          }

          start_gate eslint pnpm lint
          start_gate build pnpm build
          start_gate vitest pnpm test

          exit_code=0
          for name in "${GATES[@]}"; do
            if wait "${GATE_PIDS[$name]}"; then
              echo "PASS: $name"
            else
              code=$?
              echo "FAIL: $name (exit $code)"
              cat "gate-${name}.log"
              exit_code=1
            fi
          done
          exit "$exit_code"

  # Single gate for release workflows to depend on
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: always()
    steps:
      - name: Check all gates
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ]; then
            echo "::error::Backend gates failed"
            exit 1
          fi
          if [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "::error::Frontend gates failed"
            exit 1
          fi
          echo "All quality gates passed - safe to build images"
