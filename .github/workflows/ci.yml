name: CI - Mandatory Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend - ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - ruff
          - ruff-fix
          - black
          - black-format
          - mypy
          - bandit
          - pip-audit
          - safety
          - pytest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 1000 --retries 10 -r requirements.txt -r requirements-dev.txt
          pip install bandit safety

      - name: Run backend gate
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-backend-gate.sh" "${{ matrix.gate }}"

  frontend-quality:
    name: Frontend - ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [eslint, build, vitest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm 10.28.2
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        if: matrix.gate == 'eslint'
        run: pnpm lint

      - name: Typecheck and build
        if: matrix.gate == 'build'
        run: pnpm build

      - name: Vitest
        if: matrix.gate == 'vitest'
        run: pnpm test

  # Single required status check for branch protection and release.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: always()
    steps:
      - name: Check all gates
        run: |
          if [ "${{ needs.backend-quality.result }}" != "success" ]; then
            echo "::error::Backend gates failed"
            exit 1
          fi
          if [ "${{ needs.frontend-quality.result }}" != "success" ]; then
            echo "::error::Frontend gates failed"
            exit 1
          fi
          echo "All quality gates passed - safe to build images"
