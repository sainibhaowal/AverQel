name: Monitor - GitHub Desktop Downloads

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify GitHub release assets
    runs-on: ubuntu-latest
    env:
      RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
    steps:
      - name: Download the latest release manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/averqel-release"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 \
            "$RELEASE_BASE_URL/release-manifest.json" \
            -o "$RUNNER_TEMP/averqel-release/release-manifest.json"

      - name: Validate manifest metadata
        env:
          MANIFEST_PATH: ${{ runner.temp }}/averqel-release/release-manifest.json
        run: |
          set -euo pipefail
          python3 - "$MANIFEST_PATH" <<'PY'
          import json
          import re
          import sys

          path = sys.argv[1]
          data = json.loads(open(path, encoding="utf-8").read())
          if data.get("product") != "AverQel":
              raise SystemExit("manifest product is not AverQel")
          if not re.fullmatch(r"v\d+\.\d+\.\d+", data.get("version", "")):
              raise SystemExit("manifest version is not canonical SemVer")
          expected_current = {
              "AverQel-linux-amd64.deb",
              "AverQel-windows-x64.exe",
          }
          expected_legacy = expected_current | {
              "AverQel-linux-x86_64.rpm",
              "AverQel-macos-universal.dmg",
          }
          assets = data.get("assets", {})
          if set(assets) not in (expected_current, expected_legacy):
              raise SystemExit(f"manifest assets mismatch: {sorted(assets)}")
          if set(assets) == expected_current:
              neosis = data.get("components", {}).get("neosis", {})
              if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", neosis.get("version", "")):
                  raise SystemExit("manifest NeoSIS version is invalid")
              if not re.fullmatch(r"[0-9a-f]{40}", neosis.get("git_sha", "")):
                  raise SystemExit("manifest NeoSIS git SHA is invalid")
          for name, asset in assets.items():
              if not re.fullmatch(r"[0-9a-f]{64}", asset.get("sha256", "")):
                  raise SystemExit(f"invalid SHA-256 for {name}")
              if int(asset.get("size_bytes", 0)) <= 0:
                  raise SystemExit(f"invalid size for {name}")
          PY

      - name: Verify every direct GitHub asset responds successfully
        shell: bash
        env:
          MANIFEST_PATH: ${{ runner.temp }}/averqel-release/release-manifest.json
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            status="$(curl --fail --location --silent --show-error --retry 5 --retry-delay 3 \
              -o /dev/null -w '%{http_code}' -I \
              "$RELEASE_BASE_URL/$name")"
            test "$status" = "200" || {
              echo "::error::$name returned HTTP $status"
              exit 1
            }
            echo "$name: HTTP $status"
          done < <(python3 -c 'import json, os; print(chr(10).join(sorted(json.load(open(os.environ["MANIFEST_PATH"], encoding="utf-8"))["assets"])))')
