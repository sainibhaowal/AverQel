name: Deploy - Manual Docker Build and VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/sainibhaowal/averqel

jobs:
  resolve-source:
    name: Resolve exact main commit
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Require the protected main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Run the Docker/VPS workflow from main, not $GITHUB_REF"
            exit 1
          }

      - name: Checkout the selected main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve immutable image tag and runtime version
        id: resolve
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$SHA" FETCH_HEAD || {
            echo "::error::Selected commit is not contained in origin/main"
            exit 1
          }
          RELEASE_VERSION="$(git tag --points-at "$SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$RELEASE_VERSION" ]]; then
            # Deployment is deliberately independent from the manual desktop
            # release. This identifier is immutable, safe as a Docker tag, and
            # clearly marks a main-branch build rather than a published release.
            RELEASE_VERSION="v0.0.0-main.${SHA:0:12}"
            echo "::notice::No release tag is attached to this main commit; using $RELEASE_VERSION"
          fi
          IMAGE_TAG="sha-${SHA:0:12}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying release $RELEASE_VERSION with immutable image tag $IMAGE_TAG from main commit $SHA"

  build-and-test-images:
    name: Build and test Docker images
    needs: resolve-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend runtime base image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.base
          load: true
          tags: |
            backend-api-base:latest
            backend-worker-base:latest
          cache-from: type=gha,scope=averqel-backend-base
          cache-to: type=gha,mode=max,scope=averqel-backend-base

      - name: Build backend images without publishing yet
        env:
          AVERQEL_BACKEND_STATE_DIR: ${{ github.workspace }}/backend/.local
        run: |
          set -euo pipefail
          chmod +x backend/scripts/release_build_images.sh
          ./backend/scripts/release_build_images.sh \
            --version "${{ needs.resolve-source.outputs.release_version }}" \
            --git-sha "${{ needs.resolve-source.outputs.sha }}" \
            --image-prefix "$IMAGE_PREFIX"

      - name: Build frontend image without publishing yet
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-source.outputs.release_version }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-source.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve-source.outputs.release_version }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}
          build-args: |
            NEXT_PROXY_TARGET=http://api:1000
            GIT_VERSION=${{ needs.resolve-source.outputs.release_version }}
            GIT_SHA=${{ needs.resolve-source.outputs.sha }}
            BUILD_TIMESTAMP=${{ needs.resolve-source.outputs.image_tag }}
            DESKTOP_DOWNLOAD_BASE_URL=https://github.com/sainibhaowal/AverQel/releases/latest/download
          cache-from: type=gha,scope=averqel-frontend
          cache-to: type=gha,mode=max,scope=averqel-frontend

      - name: Smoke-test built image contents
        env:
          VERSION: ${{ needs.resolve-source.outputs.release_version }}
          SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          API_IMAGE="$IMAGE_PREFIX-api:$VERSION"
          WORKER_IMAGE="$IMAGE_PREFIX-worker:$VERSION"
          FRONTEND_IMAGE="$IMAGE_PREFIX-frontend:$VERSION"
          docker image inspect "$API_IMAGE" "$WORKER_IMAGE" "$FRONTEND_IMAGE" >/dev/null
          docker run --rm --entrypoint sh "$API_IMAGE" -c 'test -x /app/scripts/start_api.sh && test -d /app/app'
          docker run --rm --entrypoint sh "$WORKER_IMAGE" -c 'test -x /app/scripts/start_worker.sh && test -d /app/app'
          docker run --rm --entrypoint node "$FRONTEND_IMAGE" --version
          echo "Image smoke tests passed for $VERSION ($SHA)"

      - name: Install Trivy once
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241 # pinned installer commit
        with:
          version: v0.70.0
          cache: true

      - name: Restore Trivy vulnerability database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Scan API, worker, and frontend images in parallel
        env:
          RELEASE_VERSION: ${{ needs.resolve-source.outputs.release_version }}
        run: |
          set -euo pipefail
          trivy image --download-db-only
          scan() {
            local service="$1"
            trivy image \
              --format table \
              --exit-code 1 \
              --ignore-unfixed \
              --vuln-type os,library \
              --severity CRITICAL,HIGH \
              "$IMAGE_PREFIX-$service:$RELEASE_VERSION"
          }
          scan api > trivy-api.log 2>&1 & API_PID=$!
          scan worker > trivy-worker.log 2>&1 & WORKER_PID=$!
          scan frontend > trivy-frontend.log 2>&1 & FRONTEND_PID=$!
          API_STATUS=0; WORKER_STATUS=0; FRONTEND_STATUS=0
          wait "$API_PID" || API_STATUS=$?
          wait "$WORKER_PID" || WORKER_STATUS=$?
          wait "$FRONTEND_PID" || FRONTEND_STATUS=$?
          cat trivy-api.log trivy-worker.log trivy-frontend.log
          rm -f trivy-api.log trivy-worker.log trivy-frontend.log
          if (( API_STATUS != 0 || WORKER_STATUS != 0 || FRONTEND_STATUS != 0 )); then
            echo "One or more image security scans failed (api=$API_STATUS worker=$WORKER_STATUS frontend=$FRONTEND_STATUS)" >&2
            exit 1
          fi

      - name: Save Trivy vulnerability database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}

      - name: Generate image SBOMs
        run: mkdir -p security-artifacts

      - name: Generate API SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.IMAGE_PREFIX }}-api:${{ needs.resolve-source.outputs.release_version }}
          format: cyclonedx-json
          output-file: security-artifacts/averqel-api.cdx.json
          artifact-name: averqel-api-sbom

      - name: Generate worker SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.IMAGE_PREFIX }}-worker:${{ needs.resolve-source.outputs.release_version }}
          format: cyclonedx-json
          output-file: security-artifacts/averqel-worker.cdx.json
          artifact-name: averqel-worker-sbom

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-source.outputs.release_version }}
          format: cyclonedx-json
          output-file: security-artifacts/averqel-frontend.cdx.json
          artifact-name: averqel-frontend-sbom

      - name: Publish tested images to GHCR
        env:
          SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          for service in api worker frontend; do
            docker push "$IMAGE_PREFIX-$service:${{ needs.resolve-source.outputs.release_version }}"
            docker push "$IMAGE_PREFIX-$service:$SHA"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign and verify tested images
        env:
          COSIGN_YES: "true"
          SHA: ${{ needs.resolve-source.outputs.sha }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy-vps.yml@refs/heads/main
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for service in api worker frontend; do
            for tag in "${{ needs.resolve-source.outputs.release_version }}" "$SHA"; do
              IMAGE="$IMAGE_PREFIX-$service:$tag"
              cosign sign --yes "$IMAGE"
              cosign verify \
                --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
                "$IMAGE" >/dev/null
            done
          done
          echo "All published images have verified keyless signatures."

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: averqel-security-artifacts-${{ needs.resolve-source.outputs.release_version }}
          path: security-artifacts/*.json

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ needs.resolve-source.outputs.release_version }}
          path: backend/.local/dist/release-manifest-${{ needs.resolve-source.outputs.release_version }}.json

  deploy-vps:
    name: Pull tested images and deploy VPS
    needs: [resolve-source, build-and-test-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Encode SearXNG settings
        id: searxng-settings
        run: echo "settings_b64=$(base64 -w0 backend/searxng/settings.yml)" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || { echo "::error::VPS_HOST secret missing"; exit 1; }
          test -n "${{ secrets.VPS_USER }}" || { echo "::error::VPS_USER secret missing"; exit 1; }
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo "::error::VPS_SSH_KEY secret missing"; exit 1; }
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "::warning::GHCR_PAT is not set; deployment will use the short-lived GITHUB_TOKEN"
          fi

      - name: Validate SSH private-key format
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          ssh-keygen -y -P "$VPS_SSH_PASSPHRASE" -f "$KEY_FILE" >/dev/null || {
            echo "::error::VPS_SSH_KEY is not a readable private key. Store the full private key in GitHub, not the .pub file."
            exit 1
          }


      - name: SSH deploy without touching VPS-owned files
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ needs.resolve-source.outputs.release_version }}
          SHA: ${{ needs.resolve-source.outputs.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SEARXNG_SETTINGS_B64: ${{ steps.searxng-settings.outputs.settings_b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          timeout: 30s
          command_timeout: 30m
          envs: VERSION,SHA,GHCR_PAT,GITHUB_TOKEN,GITHUB_ACTOR,SEARXNG_SETTINGS_B64
          script: |
            set -euo pipefail
            VPS_BACKEND_DIR="/opt/averqel/backend"
            IMAGE_PREFIX="ghcr.io/sainibhaowal/averqel"
            COMPOSE_FILE="$VPS_BACKEND_DIR/docker-compose.prod.yml"
            ENV_FILE="$VPS_BACKEND_DIR/.env.vps"
            MODELS_DIR="$VPS_BACKEND_DIR/models"
            COMPOSE_NETWORK_OVERRIDE="$(mktemp)"
            SEARXNG_CONFIG_DIR="$VPS_BACKEND_DIR/searxng"
            SEARXNG_SETTINGS_PATH="$SEARXNG_CONFIG_DIR/settings.yml"
            export SEARXNG_CONFIG_DIR
            PREVIOUS_VERSION=""
            PREVIOUS_SHA=""

            # The gateway container already shares backend_default with AverQel.
            # Treat that pre-existing network as external instead of asking
            # Compose to claim it and fail on missing Compose labels.
            cat > "$COMPOSE_NETWORK_OVERRIDE" <<'YAML'
            networks:
              default:
                name: backend_default
                external: true
            services:
              inference:
                depends_on:
                  clamav:
                    condition: service_healthy
                environment:
                  AKS_MALWARE_SCAN_ENABLED: "true"
                  AKS_MALWARE_SCAN_REQUIRED: "true"
                  AKS_MALWARE_SCAN_HOST: clamav
                  AKS_MALWARE_SCAN_PORT: "3310"
                  AKS_MALWARE_SCAN_TIMEOUT_SECONDS: "15"
              searxng:
                volumes: !override
                  - ${SEARXNG_CONFIG_DIR}:/etc/searxng
                  - searxng_cache:/var/cache/searxng
            YAML

            compose() {
              docker compose --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" \
                -f "$COMPOSE_NETWORK_OVERRIDE" \
                "$@"
            }

            rollback_on_failure() {
              status=$?
              trap - EXIT
              if [[ "$status" -ne 0 && -n "$PREVIOUS_VERSION" && -n "$PREVIOUS_SHA" && "$PREVIOUS_VERSION" != "$VERSION" ]]; then
                echo "Deployment failed; restoring previous release $PREVIOUS_VERSION"
                set +e
                export AVERQEL_RELEASE_VERSION="$PREVIOUS_VERSION"
                export AVERQEL_IMAGE_TAG="$PREVIOUS_SHA"
                compose pull api worker maintenance-worker mcp-worker ingestion-worker scheduler inference frontend
                compose up -d --no-build --wait --wait-timeout 180 --remove-orphans
                set -e
              fi
              rm -f "$COMPOSE_NETWORK_OVERRIDE"
              exit "$status"
            }
            trap rollback_on_failure EXIT

            [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid build version: $VERSION"; exit 1; }
            PREVIOUS_VERSION="$(docker inspect averqel-api --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || true)"
            PREVIOUS_SHA="$(docker inspect averqel-api --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"

            test -d "$VPS_BACKEND_DIR" || { echo "Missing $VPS_BACKEND_DIR"; exit 1; }
            test -d "$MODELS_DIR" || { echo "Missing persistent models directory: $MODELS_DIR"; exit 1; }
            test -f "$COMPOSE_FILE" || { echo "Missing $COMPOSE_FILE"; exit 1; }
            test -f "$ENV_FILE" || { echo "Missing $ENV_FILE"; exit 1; }
            test ! -L "$SEARXNG_CONFIG_DIR" || { echo "Refusing symlinked SearXNG config directory"; exit 1; }
            test -d "$SEARXNG_CONFIG_DIR" || mkdir -p "$SEARXNG_CONFIG_DIR"
            test ! -L "$SEARXNG_SETTINGS_PATH" || { echo "Refusing symlinked SearXNG settings path"; exit 1; }
            if [[ -d "$SEARXNG_SETTINGS_PATH" ]]; then
              if find "$SEARXNG_SETTINGS_PATH" -mindepth 1 -print -quit | grep -q .; then
                echo "Refusing non-empty SearXNG settings directory: $SEARXNG_SETTINGS_PATH"
                exit 1
              fi
              rmdir "$SEARXNG_SETTINGS_PATH"
            fi
            if [[ -e "$SEARXNG_SETTINGS_PATH" ]]; then
              test -f "$SEARXNG_SETTINGS_PATH" || {
                echo "SearXNG settings path is not a regular file: $SEARXNG_SETTINGS_PATH"
                exit 1
              }
            else
              printf '%s' "$SEARXNG_SETTINGS_B64" | base64 --decode > "$SEARXNG_SETTINGS_PATH"
            fi
            chmod 600 "$SEARXNG_SETTINGS_PATH"
            test ! -L "$ENV_FILE" || { echo "Refusing symlinked environment file"; exit 1; }
            chmod 600 "$ENV_FILE"
            if ! grep -qE '^SEARXNG_SECRET=[^[:space:]#]+$' "$ENV_FILE"; then
              printf '\nSEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$ENV_FILE"
            fi

            REGISTRY_TOKEN="${GHCR_PAT:-${GITHUB_TOKEN:-}}"
            test -n "$REGISTRY_TOKEN" || { echo "Missing GHCR_PAT/GITHUB_TOKEN"; exit 1; }
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR:-github-actions[bot]}" --password-stdin
            unset REGISTRY_TOKEN GHCR_PAT GITHUB_TOKEN

            cd "$VPS_BACKEND_DIR"
            export AVERQEL_RELEASE_VERSION="$VERSION"
            export AVERQEL_IMAGE_TAG="$SHA"
            export AVERQEL_GIT_SHA="$SHA"
            export AVERQEL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            compose config --quiet
            compose pull api worker maintenance-worker mcp-worker ingestion-worker scheduler inference frontend
            compose up -d --no-build --wait --wait-timeout 180 --remove-orphans

            compose ps
            compose exec -T api curl -fsS http://localhost:1000/api/v1/health/live
            READY_RESPONSE="$(compose exec -T api curl -fsS http://localhost:1000/api/v1/health/ready)"
            echo "$READY_RESPONSE"
            echo "$READY_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

            PUBLIC_ORIGIN="$(awk -F= '$1 == "AVERQEL_PUBLIC_ORIGIN" {sub(/^[^=]*=/, ""); print}' "$ENV_FILE" | tail -n 1)"
            PUBLIC_ORIGIN="${PUBLIC_ORIGIN:-https://averqel.com}"
            PUBLIC_RESPONSE="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$PUBLIC_ORIGIN/api/v1/health/ready")"
            echo "$PUBLIC_RESPONSE"
            echo "$PUBLIC_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

            # Cleanup happens only after all health checks pass. It is scoped to
            # AverQel images; volumes and unrelated containers are untouched.
            # Keep the previous release image so rollback is immediate.
            ACTIVE_IDS="$(compose images -q | sort -u)"
            if [[ -n "$PREVIOUS_VERSION" ]]; then
              ROLLBACK_IMAGE_IDS="$(mktemp)"
              : > "$ROLLBACK_IMAGE_IDS"
              for SERVICE in api worker frontend; do
                docker image inspect "$IMAGE_PREFIX-$SERVICE:$PREVIOUS_SHA" --format '{{.Id}}' 2>/dev/null || true
              done >> "$ROLLBACK_IMAGE_IDS"
              ACTIVE_IDS="$(cat "$ROLLBACK_IMAGE_IDS"; printf '%s\n' "$ACTIVE_IDS" | sort -u)"
              rm -f "$ROLLBACK_IMAGE_IDS"
            fi
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' 'ghcr.io/sainibhaowal/averqel-*' \
              | while read -r IMAGE_REF IMAGE_ID; do
                  if ! grep -Fxq "$IMAGE_ID" <<< "$ACTIVE_IDS"; then
                    docker image rm "$IMAGE_REF" || true
                  fi
                done
