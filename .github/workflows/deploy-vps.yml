name: Deploy - Manual Docker Build and VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/sainibhaowal/averqel

jobs:
  resolve-source:
    name: Resolve exact main commit
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve.outputs.release_version }}
      sha: ${{ steps.resolve.outputs.sha }}
      build_timestamp: ${{ steps.resolve.outputs.build_timestamp }}
    steps:
      - name: Require the protected main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Run the Docker/VPS workflow from main, not $GITHUB_REF"
            exit 1
          }

      - name: Checkout the selected main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Resolve current main version and build metadata
        id: resolve
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$SHA" != "$MAIN_SHA" ]]; then
            echo "::error::This run targets $SHA, but origin/main is now $MAIN_SHA. Start a new deployment from the current main commit; re-running this older run would deploy stale frontend code."
            exit 1
          fi
          RELEASE_VERSION="$(git tag --points-at "$SHA" | grep -E '^v1\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [[ -z "$RELEASE_VERSION" ]]; then
            # Deployment is deliberately independent from the manual desktop
            # release. This identifier is immutable, safe as a Docker tag, and
            # clearly marks a main-branch build rather than a published release.
            RELEASE_VERSION="v0.0.0-main.${SHA:0:12}"
            echo "::notice::No release tag is attached to this main commit; using $RELEASE_VERSION"
          fi
          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "release_version=$RELEASE_VERSION"
            echo "sha=$SHA"
            echo "build_timestamp=$BUILD_TIMESTAMP"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying release $RELEASE_VERSION from main commit $SHA (build started $BUILD_TIMESTAMP)"

  build-and-test-images:
    name: Build and test Docker images
    needs: resolve-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout the exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend runtime base image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.base
          load: true
          tags: |
            backend-api-base:latest
            backend-worker-base:latest
          build-args: |
            APT_REFRESH_ID=${{ github.run_id }}
          cache-from: type=gha,scope=averqel-backend-base
          cache-to: type=gha,mode=max,scope=averqel-backend-base

      - name: Build backend images without publishing yet
        env:
          AVERQEL_BACKEND_STATE_DIR: ${{ github.workspace }}/backend/.local
        run: |
          set -euo pipefail
          chmod +x backend/scripts/release_build_images.sh
          ./backend/scripts/release_build_images.sh \
            --version "${{ needs.resolve-source.outputs.release_version }}" \
            --git-sha "${{ needs.resolve-source.outputs.sha }}" \
            --image-prefix "$IMAGE_PREFIX"

      - name: Build frontend image without publishing yet
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-source.outputs.release_version }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-source.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve-source.outputs.release_version }}
            org.opencontainers.image.revision=${{ needs.resolve-source.outputs.sha }}
          build-args: |
            NEXT_PROXY_TARGET=http://api:1000
            GIT_VERSION=${{ needs.resolve-source.outputs.release_version }}
            GIT_SHA=${{ needs.resolve-source.outputs.sha }}
            BUILD_TIMESTAMP=${{ needs.resolve-source.outputs.build_timestamp }}
            DESKTOP_DOWNLOAD_BASE_URL=https://github.com/sainibhaowal/AverQel/releases/latest/download
          cache-from: type=gha,scope=averqel-frontend
          cache-to: type=gha,mode=max,scope=averqel-frontend

      - name: Smoke-test built image contents
        env:
          VERSION: ${{ needs.resolve-source.outputs.release_version }}
          SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          API_IMAGE="$IMAGE_PREFIX-api:$VERSION"
          WORKER_IMAGE="$IMAGE_PREFIX-worker:$VERSION"
          FRONTEND_IMAGE="$IMAGE_PREFIX-frontend:$VERSION"
          docker image inspect "$API_IMAGE" "$WORKER_IMAGE" "$FRONTEND_IMAGE" >/dev/null
          docker run --rm --entrypoint sh "$API_IMAGE" -c 'test -x /app/scripts/start_api.sh && test -d /app/app'
          docker run --rm --entrypoint sh "$WORKER_IMAGE" -c 'test -x /app/scripts/start_worker.sh && test -d /app/app'
          for image in "$API_IMAGE" "$WORKER_IMAGE"; do
            livekit_version="$(docker run --rm --entrypoint /app/ops/livekit/livekit-server "$image" --version)"
            test "$livekit_version" = "livekit-server version 1.13.9"
          done
          docker run --rm --entrypoint node "$FRONTEND_IMAGE" --version
          FRONTEND_VERSION="$(docker image inspect "$FRONTEND_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          FRONTEND_SHA="$(docker image inspect "$FRONTEND_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$FRONTEND_VERSION" = "$VERSION" || {
            echo "::error::Frontend image version is $FRONTEND_VERSION; expected $VERSION"
            exit 1
          }
          test "$FRONTEND_SHA" = "$SHA" || {
            echo "::error::Frontend image revision is $FRONTEND_SHA; expected $SHA"
            exit 1
          }
          docker run --rm --entrypoint sh "$FRONTEND_IMAGE" -ec '
            grep -r -F -- "$1" /app/.next/server /app/.next/static >/dev/null || {
              echo "Frontend browser/server bundles do not contain the expected version: $1" >&2
              exit 1
            }
            grep -r -F -- "$2" /app/.next/server /app/.next/static >/dev/null || {
              echo "Frontend browser/server bundles do not contain the expected git SHA: $2" >&2
              exit 1
            }
          ' sh "$VERSION" "$SHA"

          FRONTEND_SMOKE_CONTAINER="averqel-frontend-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_frontend_smoke() {
            docker rm -f "$FRONTEND_SMOKE_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_frontend_smoke EXIT
          docker run --detach --name "$FRONTEND_SMOKE_CONTAINER" \
            --publish 127.0.0.1::1030 "$FRONTEND_IMAGE" >/dev/null
          FRONTEND_SMOKE_PORT="$(docker port "$FRONTEND_SMOKE_CONTAINER" 1030/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          if [[ ! "$FRONTEND_SMOKE_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve the temporary frontend smoke-test port"
            docker logs --tail 60 "$FRONTEND_SMOKE_CONTAINER" || true
            exit 1
          fi
          FRONTEND_SMOKE_URL="http://127.0.0.1:$FRONTEND_SMOKE_PORT/"
          FRONTEND_SMOKE_STATUS="not-ready"
          for ((attempt = 1; attempt <= 30; attempt++)); do
            FRONTEND_SMOKE_STATUS="$(curl --location --silent --output /dev/null --write-out '%{http_code}' \
              --max-time 1 "$FRONTEND_SMOKE_URL" 2>/dev/null || true)"
            if [[ "$FRONTEND_SMOKE_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              echo "Built frontend served its homepage successfully (HTTP $FRONTEND_SMOKE_STATUS)"
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$FRONTEND_SMOKE_CONTAINER")" != "true" ]]; then
              echo "::error::Built frontend container exited before serving its homepage (last HTTP status: $FRONTEND_SMOKE_STATUS)"
              docker logs --tail 60 "$FRONTEND_SMOKE_CONTAINER" || true
              exit 1
            fi
            sleep 1
          done
          if [[ ! "$FRONTEND_SMOKE_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Built frontend did not serve its homepage within 60 seconds (last HTTP status: $FRONTEND_SMOKE_STATUS)"
            docker logs --tail 60 "$FRONTEND_SMOKE_CONTAINER" || true
            exit 1
          fi
          cleanup_frontend_smoke
          trap - EXIT
          echo "Image smoke tests passed for frontend $VERSION ($SHA) and LiveKit 1.13.9"

      - name: Install Trivy once
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241 # pinned installer commit
        with:
          version: v0.75.0
          cache: true

      - name: Restore Trivy vulnerability database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Scan API, worker, and frontend images sequentially
        env:
          RELEASE_VERSION: ${{ needs.resolve-source.outputs.release_version }}
        run: |
          set -euo pipefail
          trivy image --download-db-only
          scan() {
            local service="$1"
            trivy image \
              --format table \
              --exit-code 1 \
              --ignore-unfixed \
              --pkg-types os,library \
              --severity CRITICAL,HIGH \
              "$IMAGE_PREFIX-$service:$RELEASE_VERSION"
          }
          API_STATUS=0; WORKER_STATUS=0; FRONTEND_STATUS=0
          scan api > trivy-api.log 2>&1 || API_STATUS=$?
          scan worker > trivy-worker.log 2>&1 || WORKER_STATUS=$?
          scan frontend > trivy-frontend.log 2>&1 || FRONTEND_STATUS=$?
          cat trivy-api.log trivy-worker.log trivy-frontend.log
          rm -f trivy-api.log trivy-worker.log trivy-frontend.log
          if (( API_STATUS != 0 || WORKER_STATUS != 0 || FRONTEND_STATUS != 0 )); then
            echo "One or more image security scans failed (api=$API_STATUS worker=$WORKER_STATUS frontend=$FRONTEND_STATUS)" >&2
            exit 1
          fi

      - name: Save Trivy vulnerability database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}

      - name: Generate image SBOMs
        run: mkdir -p security-artifacts

      - name: Generate API SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.IMAGE_PREFIX }}-api:${{ needs.resolve-source.outputs.release_version }}
          format: cyclonedx-json
          output-file: security-artifacts/averqel-api.cdx.json
          artifact-name: averqel-api-sbom

      - name: Generate worker SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.IMAGE_PREFIX }}-worker:${{ needs.resolve-source.outputs.release_version }}
          format: cyclonedx-json
          output-file: security-artifacts/averqel-worker.cdx.json
          artifact-name: averqel-worker-sbom

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.17.8
        with:
          image: ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-source.outputs.release_version }}
          format: cyclonedx-json
          output-file: security-artifacts/averqel-frontend.cdx.json
          artifact-name: averqel-frontend-sbom

      - name: Publish tested images to GHCR
        env:
          SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          for service in api worker frontend; do
            docker push "$IMAGE_PREFIX-$service:${{ needs.resolve-source.outputs.release_version }}"
            docker push "$IMAGE_PREFIX-$service:$SHA"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign and verify tested images
        env:
          COSIGN_YES: "true"
          SHA: ${{ needs.resolve-source.outputs.sha }}
          COSIGN_CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/deploy-vps.yml@refs/heads/main
          COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          for service in api worker frontend; do
            for tag in "${{ needs.resolve-source.outputs.release_version }}" "$SHA"; do
              IMAGE="$IMAGE_PREFIX-$service:$tag"
              cosign sign --yes "$IMAGE"
              cosign verify \
                --certificate-identity "$COSIGN_CERTIFICATE_IDENTITY" \
                --certificate-oidc-issuer "$COSIGN_CERTIFICATE_OIDC_ISSUER" \
                "$IMAGE" >/dev/null
            done
          done
          echo "All published images have verified keyless signatures."

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: averqel-security-artifacts-${{ needs.resolve-source.outputs.release_version }}
          path: security-artifacts/*.json

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ needs.resolve-source.outputs.release_version }}
          path: backend/.local/dist/release-manifest-${{ needs.resolve-source.outputs.release_version }}.json

  deploy-vps:
    name: Pull tested images and deploy VPS
    needs: [resolve-source, build-and-test-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.resolve-source.outputs.sha }}

      - name: Encode SearXNG settings
        id: searxng-settings
        run: echo "settings_b64=$(base64 -w0 backend/searxng/settings.yml)" >> "$GITHUB_OUTPUT"

      - name: Encode checked-in production Compose
        id: production-compose
        run: |
          {
            echo 'compose_b64<<COMPOSE_EOF'
            base64 -w0 backend/docker-compose.prod.yml
            echo
            echo COMPOSE_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}" || { echo "::error::VPS_HOST secret missing"; exit 1; }
          test -n "${VPS_USER:-}" || { echo "::error::VPS_USER secret missing"; exit 1; }
          test -n "${VPS_SSH_KEY:-}" || { echo "::error::VPS_SSH_KEY secret missing"; exit 1; }
          if [[ -z "${GHCR_PAT:-}" ]]; then
            echo "::warning::GHCR_PAT is not set; deployment will use the short-lived GITHUB_TOKEN"
          fi

      - name: Validate SSH private-key format
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_FILE"
          ssh-keygen -y -P "$VPS_SSH_PASSPHRASE" -f "$KEY_FILE" >/dev/null || {
            echo "::error::VPS_SSH_KEY is not a readable private key. Store the full private key in GitHub, not the .pub file."
            exit 1
          }

      - name: Recheck main immediately before deployment
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --force
          CURRENT_MAIN_SHA="$(git rev-parse FETCH_HEAD)"
          if [[ "$CURRENT_MAIN_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::main advanced during the image build. This run built $EXPECTED_SHA, while current main is $CURRENT_MAIN_SHA. Start a new deployment to avoid deploying an older frontend/backend."
            exit 1
          fi
          echo "Confirmed that the tested images still match current main: $EXPECTED_SHA"

      - name: SSH deploy without touching VPS-owned files
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ needs.resolve-source.outputs.release_version }}
          SHA: ${{ needs.resolve-source.outputs.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SEARXNG_SETTINGS_B64: ${{ steps.searxng-settings.outputs.settings_b64 }}
          COMPOSE_B64: ${{ steps.production-compose.outputs.compose_b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          timeout: 30s
          command_timeout: 30m
          envs: VERSION,SHA,GHCR_PAT,GITHUB_TOKEN,GITHUB_ACTOR,SEARXNG_SETTINGS_B64,COMPOSE_B64
          script: |
            set -euo pipefail
            VPS_BACKEND_DIR="/opt/averqel/backend"
            IMAGE_PREFIX="ghcr.io/sainibhaowal/averqel"
            ENV_FILE="$VPS_BACKEND_DIR/.env.vps"
            MODELS_DIR="$VPS_BACKEND_DIR/models"
            # Use the Compose file checked out for this exact main commit.
            # The VPS copy is operator-owned and may lag behind the release.
            DEPLOY_COMPOSE_FILE="$(mktemp)"
            COMPOSE_NETWORK_OVERRIDE="$(mktemp)"
            SEARXNG_CONFIG_DIR="$VPS_BACKEND_DIR/searxng"
            SEARXNG_SETTINGS_PATH="$SEARXNG_CONFIG_DIR/settings.yml"
            export SEARXNG_CONFIG_DIR
            PREVIOUS_VERSION=""
            PREVIOUS_SHA=""
            SKIP_ROLLBACK="0"

            # The gateway container already shares backend_default with AverQel.
            # Treat that pre-existing network as external instead of asking
            # Compose to claim it and fail on missing Compose labels.
            cat > "$COMPOSE_NETWORK_OVERRIDE" <<'YAML'
            networks:
              default:
                name: backend_default
                external: true
            services:
              inference:
                depends_on:
                  clamav:
                    condition: service_healthy
                environment:
                  AKS_MALWARE_SCAN_ENABLED: "true"
                  AKS_MALWARE_SCAN_REQUIRED: "true"
                  AKS_MALWARE_SCAN_HOST: clamav
                  AKS_MALWARE_SCAN_PORT: "3310"
                  AKS_MALWARE_SCAN_TIMEOUT_SECONDS: "15"
              searxng:
                volumes: !override
                  - ${SEARXNG_CONFIG_DIR}:/etc/searxng
                  - searxng_cache:/var/cache/searxng
            YAML

            compose() {
              docker compose --project-directory "$VPS_BACKEND_DIR" \
                --env-file "$ENV_FILE" \
                -f "$DEPLOY_COMPOSE_FILE" \
                -f "$COMPOSE_NETWORK_OVERRIDE" \
                "$@"
            }

            cleanup_temp_files() {
              rm -f "$DEPLOY_COMPOSE_FILE" "$COMPOSE_NETWORK_OVERRIDE"
            }

            report_frontend_health() {
              echo "Frontend health diagnostics ($1)"
              compose ps --all frontend || true
              if docker inspect averqel-frontend >/dev/null 2>&1; then
                docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not-configured{{end}} {{range .State.Health.Log}}probe(exit={{.ExitCode}} end={{.End}}): {{printf "%q" .Output}}; {{end}}' averqel-frontend || true
              else
                echo "Frontend container is missing"
              fi
            }

            rollback_on_failure() {
              status=$?
              trap - EXIT
              if [[ "$status" -ne 0 ]]; then
                report_frontend_health "before rollback"
              fi
              if [[ "$status" -ne 0 && "$SKIP_ROLLBACK" != "1" && -n "$PREVIOUS_VERSION" && -n "$PREVIOUS_SHA" && "$PREVIOUS_VERSION" != "$VERSION" ]]; then
                echo "Deployment failed; restoring previous release $PREVIOUS_VERSION"
                set +e
                export AVERQEL_RELEASE_VERSION="$PREVIOUS_VERSION"
                export AVERQEL_IMAGE_TAG="$PREVIOUS_SHA"
                compose pull api worker deepspace-control-worker maintenance-worker mcp-worker ingestion-worker scheduler inference frontend
                pull_status=$?
                compose up -d --no-build --wait --wait-timeout 180
                rollback_status=$?
                set -e
                if [[ "$pull_status" -ne 0 ]]; then
                  echo "::warning::One or more previous release images could not be pulled (exit $pull_status)."
                fi
                if [[ "$rollback_status" -eq 0 ]]; then
                  echo "Previous release $PREVIOUS_VERSION passed Compose health checks after rollback."
                else
                  echo "::error::Automatic rollback did not restore a healthy release (Compose exit $rollback_status). Production may remain unavailable."
                  report_frontend_health "after failed rollback"
                fi
              elif [[ "$status" -ne 0 && "$SKIP_ROLLBACK" == "1" ]]; then
                echo "Deployment rollback was intentionally skipped because the failure occurred during public-origin verification."
              elif [[ "$status" -ne 0 ]]; then
                echo "::error::Automatic rollback is unavailable because the previous release version or SHA could not be identified."
              fi
              cleanup_temp_files
              exit "$status"
            }
            trap rollback_on_failure EXIT

            [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid build version: $VERSION"; exit 1; }
            PREVIOUS_VERSION="$(docker inspect averqel-api --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null || true)"
            PREVIOUS_SHA="$(docker inspect averqel-api --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"

            test -d "$VPS_BACKEND_DIR" || { echo "Missing $VPS_BACKEND_DIR"; exit 1; }
            test -d "$MODELS_DIR" || { echo "Missing persistent models directory: $MODELS_DIR"; exit 1; }
            test -f "$ENV_FILE" || { echo "Missing $ENV_FILE"; exit 1; }
            printf '%s' "$COMPOSE_B64" | base64 --decode > "$DEPLOY_COMPOSE_FILE"
            chmod 600 "$DEPLOY_COMPOSE_FILE"
            test -s "$DEPLOY_COMPOSE_FILE" || { echo "Checked-in production Compose is empty"; exit 1; }
            test ! -L "$SEARXNG_CONFIG_DIR" || { echo "Refusing symlinked SearXNG config directory"; exit 1; }
            test -d "$SEARXNG_CONFIG_DIR" || mkdir -p "$SEARXNG_CONFIG_DIR"
            test ! -L "$SEARXNG_SETTINGS_PATH" || { echo "Refusing symlinked SearXNG settings path"; exit 1; }
            if [[ -d "$SEARXNG_SETTINGS_PATH" ]]; then
              if find "$SEARXNG_SETTINGS_PATH" -mindepth 1 -print -quit | grep -q .; then
                echo "Refusing non-empty SearXNG settings directory: $SEARXNG_SETTINGS_PATH"
                exit 1
              fi
              rmdir "$SEARXNG_SETTINGS_PATH"
            fi
            if [[ -e "$SEARXNG_SETTINGS_PATH" ]]; then
              test -f "$SEARXNG_SETTINGS_PATH" || {
                echo "SearXNG settings path is not a regular file: $SEARXNG_SETTINGS_PATH"
                exit 1
              }
            else
              printf '%s' "$SEARXNG_SETTINGS_B64" | base64 --decode > "$SEARXNG_SETTINGS_PATH"
            fi
            chmod 600 "$SEARXNG_SETTINGS_PATH"
            test ! -L "$ENV_FILE" || { echo "Refusing symlinked environment file"; exit 1; }
            chmod 600 "$ENV_FILE"
            if ! grep -qE '^SEARXNG_SECRET=[^[:space:]#]+$' "$ENV_FILE"; then
              printf '\nSEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$ENV_FILE"
            fi

            REGISTRY_TOKEN="${GHCR_PAT:-${GITHUB_TOKEN:-}}"
            test -n "$REGISTRY_TOKEN" || { echo "Missing GHCR_PAT/GITHUB_TOKEN"; exit 1; }
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR:-github-actions[bot]}" --password-stdin
            unset REGISTRY_TOKEN GHCR_PAT GITHUB_TOKEN

            cd "$VPS_BACKEND_DIR"
            export AVERQEL_RELEASE_VERSION="$VERSION"
            export AVERQEL_IMAGE_TAG="$SHA"
            export AVERQEL_GIT_SHA="$SHA"
            export AVERQEL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            compose config --quiet
            compose pull api worker deepspace-control-worker maintenance-worker mcp-worker ingestion-worker scheduler inference frontend
            # Keep orphan containers until the new release passes its health
            # checks. This update still uses the current fixed-name Compose
            # services; it is not a blue/green traffic switch.
            compose up -d --no-build --wait --wait-timeout 180

            EXPECTED_FRONTEND_IMAGE="$IMAGE_PREFIX-frontend:$SHA"
            EXPECTED_FRONTEND_IMAGE_ID="$(docker image inspect "$EXPECTED_FRONTEND_IMAGE" --format '{{.Id}}')"
            RUNNING_FRONTEND_IMAGE_ID="$(docker inspect averqel-frontend --format '{{.Image}}')"
            test "$RUNNING_FRONTEND_IMAGE_ID" = "$EXPECTED_FRONTEND_IMAGE_ID" || {
              echo "Frontend container is running image $RUNNING_FRONTEND_IMAGE_ID; expected $EXPECTED_FRONTEND_IMAGE_ID"
              exit 1
            }
            RUNNING_FRONTEND_VERSION="$(docker image inspect "$RUNNING_FRONTEND_IMAGE_ID" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            RUNNING_FRONTEND_SHA="$(docker image inspect "$RUNNING_FRONTEND_IMAGE_ID" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test "$RUNNING_FRONTEND_VERSION" = "$VERSION" || {
              echo "Frontend container image version is $RUNNING_FRONTEND_VERSION; expected $VERSION"
              exit 1
            }
            test "$RUNNING_FRONTEND_SHA" = "$SHA" || {
              echo "Frontend container image revision is $RUNNING_FRONTEND_SHA; expected $SHA"
              exit 1
            }
            echo "Frontend is running $RUNNING_FRONTEND_VERSION from $RUNNING_FRONTEND_SHA"

            compose ps
            compose exec -T api curl -fsS http://localhost:1000/api/v1/health/live
            READY_RESPONSE="$(compose exec -T api curl -fsS http://localhost:1000/api/v1/health/ready)"
            echo "$READY_RESPONSE"
            echo "$READY_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

            PUBLIC_ORIGIN="$(awk -F= '$1 == "AVERQEL_PUBLIC_ORIGIN" {sub(/^[^=]*=/, ""); print}' "$ENV_FILE" | tail -n 1)"
            PUBLIC_ORIGIN="${PUBLIC_ORIGIN:-https://averqel.com}"
            PUBLIC_RESPONSE="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$PUBLIC_ORIGIN/api/v1/health/ready")"
            echo "$PUBLIC_RESPONSE"
            echo "$PUBLIC_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

            # The API readiness endpoint does not prove which frontend the
            # public origin serves. Keep the healthy VPS release in place if
            # a proxy/cache still serves old web assets, but fail this run so
            # the mismatch is visible to the operator.
            SKIP_ROLLBACK="1"
            PUBLIC_FRONTEND_RESPONSE="$(curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$PUBLIC_ORIGIN/")"
            if ! grep -Fq "$VERSION" <<< "$PUBLIC_FRONTEND_RESPONSE" \
              || ! grep -Fq "${SHA:0:7}" <<< "$PUBLIC_FRONTEND_RESPONSE"; then
              echo "::error::Public frontend does not serve version $VERSION from commit ${SHA:0:7}. The VPS container is healthy; not rolling it back while checking proxy or cache routing."
              exit 1
            fi
            SKIP_ROLLBACK="0"

            # Remove stale Compose-owned services only after the selected
            # release has passed internal and public checks.
            compose up -d --no-build --wait --wait-timeout 180 --remove-orphans

            # Cleanup happens only after all health checks pass. It is scoped to
            # AverQel images; volumes and unrelated containers are untouched.
            # Keep the previous release image so rollback is immediate.
            ACTIVE_IDS="$(compose images -q | sort -u)"
            if [[ -n "$PREVIOUS_VERSION" ]]; then
              ROLLBACK_IMAGE_IDS="$(mktemp)"
              : > "$ROLLBACK_IMAGE_IDS"
              for SERVICE in api worker frontend; do
                docker image inspect "$IMAGE_PREFIX-$SERVICE:$PREVIOUS_SHA" --format '{{.Id}}' 2>/dev/null || true
              done >> "$ROLLBACK_IMAGE_IDS"
              ACTIVE_IDS="$(cat "$ROLLBACK_IMAGE_IDS"; printf '%s\n' "$ACTIVE_IDS" | sort -u)"
              rm -f "$ROLLBACK_IMAGE_IDS"
            fi
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' 'ghcr.io/sainibhaowal/averqel-*' \
              | while read -r IMAGE_REF IMAGE_ID; do
                  if ! grep -Fxq "$IMAGE_ID" <<< "$ACTIVE_IDS"; then
                    docker image rm "$IMAGE_REF" || true
                  fi
                done
