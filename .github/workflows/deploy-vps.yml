name: Deploy - Manual Docker Build and VPS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing semantic version tag to build and deploy (for example v1.6.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/sainibhaowal/averqel

jobs:
  resolve-release:
    name: Resolve exact tagged commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve and validate semantic tag
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must be a stable semantic version such as v1.6.1"
            exit 1
          }
          git fetch --tags --force
          SHA="$(git rev-parse "refs/tags/$VERSION^{commit}")"
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "::error::Tag $VERSION is not contained in main"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $VERSION from $SHA"

  build-and-test-images:
    name: Build and test Docker images
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the exact tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend runtime base image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.base
          load: true
          tags: |
            backend-api-base:latest
            backend-worker-base:latest
          cache-from: type=gha,scope=averqel-backend-base
          cache-to: type=gha,mode=max,scope=averqel-backend-base

      - name: Build backend images without publishing yet
        env:
          AVERQEL_BACKEND_STATE_DIR: ${{ github.workspace }}/backend/.local
        run: |
          set -euo pipefail
          chmod +x backend/scripts/release_build_images.sh
          ./backend/scripts/release_build_images.sh \
            --version "${{ needs.resolve-release.outputs.version }}" \
            --git-sha "${{ needs.resolve-release.outputs.sha }}" \
            --image-prefix "$IMAGE_PREFIX"

      - name: Build frontend image without publishing yet
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-release.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.resolve-release.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve-release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.resolve-release.outputs.sha }}
          build-args: |
            NEXT_PROXY_TARGET=http://api:1000
            GIT_VERSION=${{ needs.resolve-release.outputs.version }}
            GIT_SHA=${{ needs.resolve-release.outputs.sha }}
            BUILD_TIMESTAMP=${{ needs.resolve-release.outputs.version }}
          cache-from: type=gha,scope=averqel-frontend
          cache-to: type=gha,mode=max,scope=averqel-frontend

      - name: Smoke-test built image contents
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
          SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          set -euo pipefail
          API_IMAGE="$IMAGE_PREFIX-api:$VERSION"
          WORKER_IMAGE="$IMAGE_PREFIX-worker:$VERSION"
          FRONTEND_IMAGE="$IMAGE_PREFIX-frontend:$VERSION"
          docker image inspect "$API_IMAGE" "$WORKER_IMAGE" "$FRONTEND_IMAGE" >/dev/null
          docker run --rm --entrypoint sh "$API_IMAGE" -c 'test -x /app/scripts/start_api.sh && test -d /app/app'
          docker run --rm --entrypoint sh "$WORKER_IMAGE" -c 'test -x /app/scripts/start_worker.sh && test -d /app/app'
          docker run --rm --entrypoint node "$FRONTEND_IMAGE" --version
          echo "Image smoke tests passed for $VERSION ($SHA)"

      - name: Publish tested images to GHCR
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
          SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          set -euo pipefail
          for service in api worker frontend; do
            docker push "$IMAGE_PREFIX-$service:$VERSION"
            docker push "$IMAGE_PREFIX-$service:$SHA"
          done

      - name: Upload image manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest-${{ needs.resolve-release.outputs.version }}
          path: backend/.local/dist/release-manifest-${{ needs.resolve-release.outputs.version }}.json

  deploy-vps:
    name: Pull tested images and deploy VPS
    needs: [resolve-release, build-and-test-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || { echo "::error::VPS_HOST secret missing"; exit 1; }
          test -n "${{ secrets.VPS_USER }}" || { echo "::error::VPS_USER secret missing"; exit 1; }
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo "::error::VPS_SSH_KEY secret missing"; exit 1; }
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "::warning::GHCR_PAT is not set; deployment will use the short-lived GITHUB_TOKEN"
          fi

      - name: SSH deploy without touching VPS-owned files
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
          SHA: ${{ needs.resolve-release.outputs.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VERSION,SHA,GHCR_PAT,GITHUB_TOKEN,GITHUB_ACTOR
          script_stop: true
          script: |
            set -euo pipefail
            VPS_BACKEND_DIR="/opt/averqel/backend"
            COMPOSE_FILE="$VPS_BACKEND_DIR/docker-compose.prod.yml"
            ENV_FILE="$VPS_BACKEND_DIR/.env.vps"
            MODELS_DIR="$VPS_BACKEND_DIR/models"

            test -d "$VPS_BACKEND_DIR" || { echo "Missing $VPS_BACKEND_DIR"; exit 1; }
            test -d "$MODELS_DIR" || { echo "Missing persistent models directory: $MODELS_DIR"; exit 1; }
            test -f "$COMPOSE_FILE" || { echo "Missing $COMPOSE_FILE"; exit 1; }
            test -f "$ENV_FILE" || { echo "Missing $ENV_FILE"; exit 1; }

            REGISTRY_TOKEN="${GHCR_PAT:-${GITHUB_TOKEN:-}}"
            test -n "$REGISTRY_TOKEN" || { echo "Missing GHCR_PAT/GITHUB_TOKEN"; exit 1; }
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR:-github-actions[bot]}" --password-stdin
            unset REGISTRY_TOKEN GHCR_PAT GITHUB_TOKEN

            cd "$VPS_BACKEND_DIR"
            export AVERQEL_RELEASE_VERSION="$VERSION"
            export AVERQEL_GIT_SHA="$SHA"
            export AVERQEL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" config --quiet
            AVERQEL_RELEASE_VERSION="$VERSION" docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull api worker maintenance-worker ingestion-worker scheduler inference frontend
            AVERQEL_RELEASE_VERSION="$VERSION" AVERQEL_GIT_SHA="$SHA" docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-build --wait --wait-timeout 180 --remove-orphans

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" exec -T api curl -fsS http://localhost:1000/api/v1/health/live
            READY_RESPONSE="$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" exec -T api curl -fsS http://localhost:1000/api/v1/health/ready)"
            echo "$READY_RESPONSE"
            echo "$READY_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

            PUBLIC_ORIGIN="$(awk -F= '$1 == "AVERQEL_PUBLIC_ORIGIN" {sub(/^[^=]*=/, ""); print}' "$ENV_FILE" | tail -n 1)"
            PUBLIC_ORIGIN="${PUBLIC_ORIGIN:-https://averqel.com}"
            PUBLIC_RESPONSE="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$PUBLIC_ORIGIN/api/v1/health/ready")"
            echo "$PUBLIC_RESPONSE"
            echo "$PUBLIC_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

            # Cleanup happens only after all health checks pass. It is scoped to
            # AverQel images; volumes and unrelated containers are untouched.
            ACTIVE_IDS="$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" images -q | sort -u)"
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' 'ghcr.io/sainibhaowal/averqel-*' \
              | while read -r IMAGE_REF IMAGE_ID; do
                  if ! grep -Fxq "$IMAGE_ID" <<< "$ACTIVE_IDS"; then
                    docker image rm "$IMAGE_REF" || true
                  fi
                done
            docker image prune -f
