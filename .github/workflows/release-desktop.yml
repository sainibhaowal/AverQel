name: Desktop Release - desktop-v* Private

on:
  push:
    tags:
      - "desktop-v*.*.*"
      - "desktop-v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Manual desktop tag like desktop-v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gates before desktop build
  frontend-gates:
    name: Frontend Gates before Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  build-desktop:
    name: Build Desktop ${{ matrix.platform }}
    needs: frontend-gates
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve desktop version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if ! [[ "$VERSION" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::Desktop version must be desktop-v*.*.* e.g. desktop-v1.0.0 got $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install desktop dependencies
        run: |
          cd applications/desktop
          pnpm install --frozen-lockfile

      - name: build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.vars.outputs.version }}
          releaseName: AverQel Desktop ${{ steps.vars.outputs.version }}
          releaseBody: |
            ## AverQel Desktop ${{ steps.vars.outputs.version }} - Private

            Shell for https://averqel.com - loads live web. No backend rebuild needed for most backend releases.

            Install:
            - Ubuntu: `.deb`
            - Windows: `.msi` / `.exe` (NSIS)

            Auto-generated notes below:
          releaseDraft: false
          prerelease: ${{ contains(steps.vars.outputs.version, '-rc') || contains(steps.vars.outputs.version, '-beta') }}
          projectPath: ./applications/desktop

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: averqel-desktop-${{ matrix.platform }}-${{ steps.vars.outputs.version }}
          path: |
            applications/desktop/src-tauri/target/release/bundle/deb/*.deb
            applications/desktop/src-tauri/target/release/bundle/msi/*.msi
            applications/desktop/src-tauri/target/release/bundle/nsis/*.exe
