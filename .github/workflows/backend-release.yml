name: Backend Release

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight checks
        run: ./backend/scripts/release_verify.sh --dry-run

  build:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release images
        run: ./backend/scripts/release_build_images.sh
