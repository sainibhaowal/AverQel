name: Auto PR After Green CI

on:
  workflow_run:
    workflows: ["CI - Mandatory Quality Gates"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  create-pull-request:
    name: Create Pull Request After Green CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse pull request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.workflow_run.head_branch;
            const head = `${owner}:${branch}`;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              core.info(`Pull request #${existing.data[0].number} already exists for ${head}`);
              return;
            }

            const commit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: context.payload.workflow_run.head_sha,
            });
            const title = commit.data.commit.message.split('\n')[0].slice(0, 250);
            const runUrl = context.payload.workflow_run.html_url;

            const pullRequest = await github.rest.pulls.create({
              owner,
              repo,
              head: branch,
              base: 'main',
              title: title || `Merge ${branch} into main`,
              body: [
                '## Automatic pull request',
                '',
                'This pull request was created automatically after all CI quality gates passed on the branch.',
                '',
                `- Source branch: \`${branch}\``,
                `- Tested commit: \`${context.payload.workflow_run.head_sha}\``,
                `- CI run: ${runUrl}`,
                '',
                'Review the green CI checks, then merge this pull request into `main`.',
              ].join('\n'),
              maintainer_can_modify: true,
            });

            core.info(`Created pull request #${pullRequest.data.number}: ${pullRequest.data.html_url}`);
