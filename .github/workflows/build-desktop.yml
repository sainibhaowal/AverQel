name: Build Desktop App (DEPRECATED - use release-desktop.yml)

on:
  push:
    branches: [ true_clean_start ]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf


      - name: install desktop dependencies
        run: |
          cd applications/desktop
          pnpm install

      - name: build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "DoxWise v__VERSION__"
          releaseBody: "DoxWise Desktop — loads live from https://doxwise.faimatrix.com"
          releaseDraft: true
          prerelease: false
          projectPath: ./applications/desktop

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doxwise-${{ matrix.platform }}
          path: |
            applications/desktop/src-tauri/target/release/bundle/deb/*.deb
            applications/desktop/src-tauri/target/release/bundle/msi/*.msi
            applications/desktop/src-tauri/target/release/bundle/nsis/*.exe
