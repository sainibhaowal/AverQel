name: Backend CI

on:
  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 1000 --retries 10 -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check app tests alembic scripts

      - name: Black
        run: black --check app tests alembic scripts

      - name: Mypy
        run: mypy app tests

      - name: Pytest
        run: pytest

      - name: Bandit
        run: bandit -r app -q

      - name: Pip Audit
        run: pip-audit -s osv -r requirements.txt -r requirements-dev.txt
