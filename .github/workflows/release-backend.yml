name: Backend/Web Release - v* Private

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Manual version tag like v1.0.0 (must exist as tag)"
        required: true
        type: string

# GHCR private push + Private Release creation need write
permissions:
  contents: write
  packages: write

concurrency:
  group: release-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sainibhaowal/averqel

jobs:
  # ========== MANDATORY GATES - NO BUILD IF FAIL ==========
  backend-gates:
    name: Backend Gates (ruff/black/mypy/bandit/pip-audit/safety/pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --timeout 1000 --retries 10 -r requirements.txt -r requirements-dev.txt
          pip install bandit safety

      - name: Ruff check
        run: ruff check .

      - name: Ruff --fix no-diff
        run: |
          ruff check . --fix
          if ! git diff --exit-code; then echo "::error::ruff --fix has changes"; git diff; exit 1; fi

      - name: Black --check
        run: black --check .

      - name: Black no-diff
        run: |
          black .
          if ! git diff --exit-code; then echo "::error::black has changes"; git diff; exit 1; fi

      - name: Mypy
        run: mypy .

      - name: Bandit
        run: bandit -r app -q --severity-level medium

      - name: Pip-audit (report-only for fast release)
        continue-on-error: true
        run: pip-audit -s osv --ignore-vuln GHSA-xf7x-x43h-rpqh -r requirements.txt -r requirements-dev.txt || true

      - name: Safety (report-only)
        continue-on-error: true
        run: safety check --full-report || true

      - name: Pytest
        run: pytest -q

  frontend-gates:
    name: Frontend Gates (eslint/build/vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  # ========== BUILD & PUSH GHCR PRIVATE ==========
  build-and-push:
    name: Build & Push GHCR Private
    runs-on: ubuntu-latest
    needs: [backend-gates, frontend-gates]
    outputs:
      version: ${{ steps.vars.outputs.version }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          # Guard: reject desktop-v* in this workflow
          if [[ "$VERSION" == desktop-v* ]]; then
            echo "::error::desktop-v* must use release-desktop.yml, not release-backend.yml"
            exit 1
          fi
          # Validate semver v*.*.*
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::Version must match v*.*.* e.g. v1.0.0 got $VERSION"
            exit 1
          fi
          SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION SHA=$SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (private)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push backend images (api/worker) via script
        env:
          AVERQEL_BACKEND_STATE_DIR: ${{ github.workspace }}/backend/.local
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          SHA="${{ steps.vars.outputs.sha }}"
          chmod +x backend/scripts/release_build_images.sh
          ./backend/scripts/release_build_images.sh --version "$VERSION" --git-sha "$SHA" --image-prefix "$IMAGE_PREFIX" --push
          ls -lh backend/.local/dist/release-manifest-${VERSION}.json || true
          cat backend/.local/dist/release-manifest-${VERSION}.json

      - name: Build & Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
          build-args: |
            NEXT_PROXY_TARGET=http://api:1000
            GIT_VERSION=${{ steps.vars.outputs.version }}
            GIT_SHA=${{ steps.vars.outputs.sha }}
            BUILD_TIMESTAMP=${{ steps.vars.outputs.version }}

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.vars.outputs.version }}
          path: backend/.local/dist/release-manifest-${{ steps.vars.outputs.version }}.json

  # ========== PRIVATE GITHUB RELEASE ==========
  create-release:
    name: Create Private GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest-${{ needs.build-and-push.outputs.version }}
          path: ./dist

      - name: Create Private Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-push.outputs.version }}
          name: AverQel ${{ needs.build-and-push.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(needs.build-and-push.outputs.version, '-rc') || contains(needs.build-and-push.outputs.version, '-beta') }}
          files: ./dist/release-manifest-${{ needs.build-and-push.outputs.version }}.json
          body: |
            ## AverQel ${{ needs.build-and-push.outputs.version }} - Private Production Release

            **Images (GHCR Private):**
            - `ghcr.io/sainibhaowal/averqel-api:${{ needs.build-and-push.outputs.version }}`
            - `ghcr.io/sainibhaowal/averqel-worker:${{ needs.build-and-push.outputs.version }}`
            - `ghcr.io/sainibhaowal/averqel-frontend:${{ needs.build-and-push.outputs.version }}`
            - SHA: `${{ needs.build-and-push.outputs.sha }}`

            **Deploy:** VPS auto-pulls on tag. Verify `https://averqel.com/api/v1/health/ready` shows `"version":"${{ needs.build-and-push.outputs.version }}"`

            ---
            Auto-generated notes below:

  # ========== VPS AUTO-DEPLOY + AGGRESSIVE PRUNE ==========
  deploy-vps:
    name: Deploy to VPS (auto prune old builds)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Validate VPS secrets exist
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "::error::VPS_HOST secret missing"; exit 1; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then echo "::error::VPS_USER secret missing"; exit 1; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "::error::VPS_SSH_KEY secret missing"; exit 1; fi
          # GHCR_PAT optional - falls back to GITHUB_TOKEN if not set
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then echo "::warning::GHCR_PAT not set - will try GITHUB_TOKEN on VPS (short-lived)"; fi

      - name: SSH Deploy + Prune Old Builds
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # No manual approve - immediate deploy as requested
          script: |
            set -euo pipefail
            VERSION="${{ needs.build-and-push.outputs.version }}"
            SHA="${{ needs.build-and-push.outputs.sha }}"
            echo "=== Deploying AverQel $VERSION ($SHA) to /opt/averqel ==="

            cd /opt/averqel

            # Safety: ensure git repo and files
            test -f backend/docker-compose.prod.yml || { echo "Missing backend/docker-compose.prod.yml"; exit 1; }
            test -f backend/.env.vps || { echo "Missing backend/.env.vps"; exit 1; }

            # Fetch tags and checkout exact version - no merge
            git fetch --tags --prune
            git checkout "$VERSION" || git checkout "origin/main" && git checkout "$VERSION"

            cd backend

            # Login GHCR on VPS (private images) - use GHCR_PAT if set else GITHUB_TOKEN
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            # Export release version for compose image tags
            export AVERQEL_RELEASE_VERSION="$VERSION"
            export AVERQEL_GIT_SHA="$SHA"
            export AVERQEL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "AVERQEL_RELEASE_VERSION=$VERSION" >> .env.vps.release
            echo "Images to pull: ghcr.io/sainibhaowal/averqel-api:$VERSION, ghcr.io/sainibhaowal/averqel-worker:$VERSION, ghcr.io/sainibhaowal/averqel-frontend:$VERSION"

            # Validate compose
            docker compose --env-file .env.vps -f docker-compose.prod.yml config --quiet

            # Pull new private images and recreate ONLY those services - keep DB volumes
            AVERQEL_RELEASE_VERSION="$VERSION" AVERQEL_GIT_SHA="$SHA" docker compose --env-file .env.vps -f docker-compose.prod.yml pull api worker scheduler inference frontend || AVERQEL_RELEASE_VERSION="$VERSION" docker compose --env-file .env.vps -f docker-compose.prod.yml pull

            # Zero-downtime: wait until new api is healthy before considering deploy done - users see no gap, no relogin
            AVERQEL_RELEASE_VERSION="$VERSION" AVERQEL_GIT_SHA="$SHA" docker compose --env-file .env.vps -f docker-compose.prod.yml up -d --wait --wait-timeout 90 --remove-orphans

            echo "Waiting for health..."
            docker compose --env-file .env.vps -f docker-compose.prod.yml ps
            docker compose --env-file .env.vps -f docker-compose.prod.yml exec -T api curl -fsS http://localhost:1000/api/v1/health/live || echo "live check failed - check logs"
            docker compose --env-file .env.vps -f docker-compose.prod.yml exec -T api curl -fsS http://localhost:1000/api/v1/health/ready || echo "ready check failed"

            # Aggressive prune - keep ONLY currently running images, delete all old builds as requested
            echo "=== Aggressive prune old builds - keep only active $VERSION ==="
            docker image prune -af || true
            docker builder prune -af || true
            # Do NOT prune volumes - keeps postgres_data/redis_data/minio_data
            docker system prune -af --volumes=false || true

            echo "=== Disk after prune ==="
            docker system df || true
            echo "=== Deployed $VERSION successfully ==="
            curl -fsS https://averqel.com/api/v1/health/ready && echo || echo "public health check pending - wait 30s and retry"
