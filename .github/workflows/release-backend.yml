name: Release Main - Automatic SemVer, Images, VPS, Desktop

on:
  workflow_run:
    workflows: ["CI - Mandatory Quality Gates"]
    types: [completed]

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: release-main-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/sainibhaowal/averqel

jobs:
  prepare-release:
    name: Calculate SemVer from merged commits
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout the exact commit tested by CI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Calculate next version
        id: version
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/next-semver.sh

          CURRENT_TAG="$(git tag --points-at "$RELEASE_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$CURRENT_TAG" ]]; then
            VERSION="$CURRENT_TAG"
            echo "Existing release tag found for this commit: $VERSION"
          else
            VERSION="$(.github/scripts/next-semver.sh "$RELEASE_SHA")"
            echo "Calculated release version: $VERSION"
          fi

          SHA="$(git rev-parse "$RELEASE_SHA")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and Push Application Images
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend runtime base image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.base
          load: true
          tags: |
            backend-api-base:latest
            backend-worker-base:latest
          cache-from: type=gha,scope=averqel-backend-base
          cache-to: type=gha,mode=max,scope=averqel-backend-base

      - name: Build and push backend images
        env:
          AVERQEL_BACKEND_STATE_DIR: ${{ github.workspace }}/backend/.local
        run: |
          set -euo pipefail
          chmod +x backend/scripts/release_build_images.sh
          ./backend/scripts/release_build_images.sh \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --git-sha "${{ needs.prepare-release.outputs.sha }}" \
            --image-prefix "$IMAGE_PREFIX" \
            --push
          test -s "backend/.local/dist/release-manifest-${{ needs.prepare-release.outputs.version }}.json"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.prepare-release.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-frontend:${{ needs.prepare-release.outputs.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare-release.outputs.sha }}
          build-args: |
            NEXT_PROXY_TARGET=http://api:1000
            GIT_VERSION=${{ needs.prepare-release.outputs.version }}
            GIT_SHA=${{ needs.prepare-release.outputs.sha }}
            BUILD_TIMESTAMP=${{ needs.prepare-release.outputs.version }}
          cache-from: type=gha,scope=averqel-frontend
          cache-to: type=gha,mode=max,scope=averqel-frontend

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.prepare-release.outputs.version }}
          path: backend/.local/dist/release-manifest-${{ needs.prepare-release.outputs.version }}.json

  build-desktop:
    name: Build Desktop ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install desktop dependencies
        working-directory: applications/desktop
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        working-directory: applications/desktop
        run: pnpm tauri build

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: averqel-desktop-${{ matrix.platform }}-${{ needs.prepare-release.outputs.version }}
          path: |
            applications/desktop/src-tauri/target/release/bundle/deb/*.deb
            applications/desktop/src-tauri/target/release/bundle/msi/*.msi
            applications/desktop/src-tauri/target/release/bundle/nsis/*.exe

  deploy-vps:
    name: Pull Images and Deploy VPS
    needs: [prepare-release, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}" || { echo "::error::VPS_HOST secret missing"; exit 1; }
          test -n "${{ secrets.VPS_USER }}" || { echo "::error::VPS_USER secret missing"; exit 1; }
          test -n "${{ secrets.VPS_SSH_KEY }}" || { echo "::error::VPS_SSH_KEY secret missing"; exit 1; }
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "::warning::GHCR_PAT is not set; deployment will use the short-lived GITHUB_TOKEN"
          fi

      - name: SSH deploy without touching VPS-owned files
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          SHA: ${{ needs.prepare-release.outputs.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VERSION,SHA,GHCR_PAT,GITHUB_TOKEN,GITHUB_ACTOR
          script_stop: true
          script: |
            set -euo pipefail
            VPS_BACKEND_DIR="/opt/averqel/backend"
            COMPOSE_FILE="$VPS_BACKEND_DIR/docker-compose.prod.yml"
            ENV_FILE="$VPS_BACKEND_DIR/.env.vps"
            MODELS_DIR="$VPS_BACKEND_DIR/models"

            test -d "$VPS_BACKEND_DIR" || { echo "Missing $VPS_BACKEND_DIR"; exit 1; }
            test -d "$MODELS_DIR" || { echo "Missing persistent models directory: $MODELS_DIR"; exit 1; }
            test -f "$COMPOSE_FILE" || { echo "Missing $COMPOSE_FILE"; exit 1; }
            test -f "$ENV_FILE" || { echo "Missing $ENV_FILE"; exit 1; }

            REGISTRY_TOKEN="${GHCR_PAT:-${GITHUB_TOKEN:-}}"
            test -n "$REGISTRY_TOKEN" || { echo "Missing GHCR_PAT/GITHUB_TOKEN"; exit 1; }
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR:-github-actions[bot]}" --password-stdin
            unset REGISTRY_TOKEN GHCR_PAT GITHUB_TOKEN

            cd "$VPS_BACKEND_DIR"
            export AVERQEL_RELEASE_VERSION="$VERSION"
            export AVERQEL_GIT_SHA="$SHA"
            export AVERQEL_BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" config --quiet
            AVERQEL_RELEASE_VERSION="$VERSION" docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" pull api worker maintenance-worker ingestion-worker scheduler inference frontend
            AVERQEL_RELEASE_VERSION="$VERSION" AVERQEL_GIT_SHA="$SHA" docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" up -d --no-build --wait --wait-timeout 180 --remove-orphans

            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" ps
            docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" exec -T api curl -fsS http://localhost:1000/api/v1/health/live
            READY_RESPONSE="$(docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" exec -T api curl -fsS http://localhost:1000/api/v1/health/ready)"
            echo "$READY_RESPONSE"
            echo "$READY_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

            docker image prune -af
            docker builder prune -af
            docker system prune -af --volumes=false

            PUBLIC_ORIGIN="$(awk -F= '$1 == "AVERQEL_PUBLIC_ORIGIN" {sub(/^[^=]*=/, ""); print}' "$ENV_FILE" | tail -n 1)"
            PUBLIC_ORIGIN="${PUBLIC_ORIGIN:-https://averqel.com}"
            PUBLIC_RESPONSE="$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "$PUBLIC_ORIGIN/api/v1/health/ready")"
            echo "$PUBLIC_RESPONSE"
            echo "$PUBLIC_RESPONSE" | grep -Eq '"version"[[:space:]]*:[[:space:]]*"'"$VERSION"'"'

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-and-push, build-desktop, deploy-vps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Create or verify release tag
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            EXISTING_SHA="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            test "$EXISTING_SHA" = "$RELEASE_SHA" || { echo "Tag $VERSION points to $EXISTING_SHA, expected $RELEASE_SHA"; exit 1; }
          else
            git tag -a "$VERSION" "$RELEASE_SHA" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest-${{ needs.prepare-release.outputs.version }}
          path: ./dist

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: averqel-desktop-*
          path: ./desktop-release-artifacts
          merge-multiple: true

      - name: Create GitHub release with all downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: AverQel ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ./dist/release-manifest-${{ needs.prepare-release.outputs.version }}.json
            ./desktop-release-artifacts/**/*
          body: |
            ## AverQel ${{ needs.prepare-release.outputs.version }}

            Images were built from commit `${{ needs.prepare-release.outputs.sha }}` and deployed automatically to `/opt/averqel/backend`.

            Docker images:
            - `ghcr.io/sainibhaowal/averqel-api:${{ needs.prepare-release.outputs.version }}`
            - `ghcr.io/sainibhaowal/averqel-worker:${{ needs.prepare-release.outputs.version }}`
            - `ghcr.io/sainibhaowal/averqel-frontend:${{ needs.prepare-release.outputs.version }}`

            Desktop downloads are attached below: Ubuntu `.deb`, Windows `.msi` and `.exe`.
