name: Release - Manual SemVer and Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-semver-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manual release target
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Run the semantic release workflow from main, not $GITHUB_REF"
            exit 1
          }

  prepare-release:
    name: Calculate SemVer from main
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout the selected main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Calculate next version
        id: version
        run: |
          set -euo pipefail
          chmod +x .github/scripts/next-semver.sh

          CURRENT_TAG="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$CURRENT_TAG" ]]; then
            VERSION="$CURRENT_TAG"
            echo "Existing release tag found for this commit: $VERSION"
          else
            VERSION="$(.github/scripts/next-semver.sh "$GITHUB_SHA")"
            echo "Calculated release version: $VERSION"
          fi

          SHA="$(git rev-parse "$GITHUB_SHA")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build Desktop ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install desktop dependencies
        working-directory: applications/desktop
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        working-directory: applications/desktop
        run: pnpm tauri build

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: averqel-desktop-${{ matrix.platform }}-${{ needs.prepare-release.outputs.version }}
          path: |
            applications/desktop/src-tauri/target/release/bundle/deb/*.deb
            applications/desktop/src-tauri/target/release/bundle/msi/*.msi
            applications/desktop/src-tauri/target/release/bundle/nsis/*.exe

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Create or verify release tag
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            EXISTING_SHA="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            test "$EXISTING_SHA" = "$RELEASE_SHA" || {
              echo "Tag $VERSION points to $EXISTING_SHA, expected $RELEASE_SHA"
              exit 1
            }
          else
            git tag -a "$VERSION" "$RELEASE_SHA" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: averqel-desktop-*
          path: ./desktop-release-artifacts
          merge-multiple: true

      - name: Create GitHub release with desktop downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: AverQel ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: ./desktop-release-artifacts/**/*
          body: |
            ## AverQel ${{ needs.prepare-release.outputs.version }}

            Built manually from protected `main` commit `${{ needs.prepare-release.outputs.sha }}`.

            Docker/VPS deployment is a separate manual workflow and is not started automatically.
