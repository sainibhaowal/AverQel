name: Release - Manual SemVer and Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-semver-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manual release target
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Run the semantic release workflow from main, not $GITHUB_REF"
            exit 1
          }

  prepare-release:
    name: Calculate SemVer from main
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Checkout the selected main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Calculate next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/next-semver.sh

          # Only published canonical SemVer releases define the release line.
          # Historical feature tags and legacy averqel-* tags are preserved but
          # must not move the next product version forward.
          LATEST_RELEASE_TAG="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)"

          CURRENT_TAG="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$CURRENT_TAG" ]]; then
            VERSION="$CURRENT_TAG"
            echo "Existing release tag found for this commit: $VERSION"
          elif [[ -n "$LATEST_RELEASE_TAG" ]]; then
            VERSION="$(.github/scripts/next-semver.sh "$GITHUB_SHA" "$LATEST_RELEASE_TAG")"
            echo "Latest published canonical release: $LATEST_RELEASE_TAG"
            echo "Calculated next release version: $VERSION"
          else
            VERSION="$(.github/scripts/next-semver.sh "$GITHUB_SHA")"
            echo "Calculated release version: $VERSION"
          fi

          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid release tag '$VERSION'; expected vMAJOR.MINOR.PATCH"
            exit 1
          }

          SHA="$(git rev-parse "$GITHUB_SHA")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build Desktop ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            applications/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Electron dependencies
        run: pnpm --dir applications/desktop install --frozen-lockfile

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build the production frontend for Electron
        env:
          BUILD_TARGET: desktop
          NEXT_PUBLIC_APP_VERSION: ${{ needs.prepare-release.outputs.version }}
          NEXT_PUBLIC_GIT_SHA: ${{ needs.prepare-release.outputs.sha }}
          NEXT_PUBLIC_DESKTOP_DOWNLOAD_BASE_URL: /downloads/latest
        run: pnpm --dir frontend build

      - name: Stamp the semantic release version into the desktop app
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/stamp-desktop-version.mjs "${RELEASE_VERSION#v}"

      - name: Build Linux desktop package
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm --dir applications/desktop build:linux

      - name: Build Windows desktop package
        if: matrix.platform == 'windows-latest'
        run: pnpm --dir applications/desktop build:windows

      - name: Build macOS desktop package
        if: startsWith(matrix.platform, 'macos-')
        run: pnpm --dir applications/desktop build:mac

      - name: Normalize desktop package names
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          rename_if_needed() {
            local source="$1"
            local target="$2"
            if [[ "$source" != "$target" ]]; then
              mv -- "$source" "$target"
            fi
          }
          case "$RUNNER_OS" in
            Linux)
              DEB_PATH="$(find applications/desktop/release -maxdepth 1 -type f -name '*.deb' -print -quit)"
              RPM_PATH="$(find applications/desktop/release -maxdepth 1 -type f -name '*.rpm' -print -quit)"
              test -n "$DEB_PATH" && test -n "$RPM_PATH"
              rename_if_needed "$DEB_PATH" "$(dirname "$DEB_PATH")/AverQel_${VERSION}_amd64.deb"
              rename_if_needed "$RPM_PATH" "$(dirname "$RPM_PATH")/AverQel_${VERSION}_x86_64.rpm"
              ;;
            Windows)
              EXE_PATH="$(find applications/desktop/release -maxdepth 1 -type f -name '*.exe' -print -quit)"
              test -n "$EXE_PATH"
              rename_if_needed "$EXE_PATH" "$(dirname "$EXE_PATH")/AverQel_${VERSION}_x64-setup.exe"
              ;;
            macOS)
              DMG_PATH="$(find applications/desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
              test -n "$DMG_PATH"
              rename_if_needed "$DMG_PATH" "$(dirname "$DMG_PATH")/AverQel_${VERSION}_universal.dmg"
              ;;
            *)
              echo "Unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: averqel-desktop-${{ matrix.platform }}-${{ needs.prepare-release.outputs.version }}
          path: |
            applications/desktop/release/*.deb
            applications/desktop/release/*.rpm
            applications/desktop/release/*.exe
            applications/desktop/release/*.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.sha }}

      - name: Create or verify release tag
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Refusing non-semantic release tag '$VERSION'"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            EXISTING_SHA="$(git rev-parse "refs/tags/$VERSION^{commit}")"
            test "$EXISTING_SHA" = "$RELEASE_SHA" || {
              echo "Tag $VERSION points to $EXISTING_SHA, expected $RELEASE_SHA"
              exit 1
            }
          else
            git tag -a "$VERSION" "$RELEASE_SHA" -m "Release $VERSION"
            git push origin "$VERSION"
          fi

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: averqel-desktop-*
          path: ./desktop-release-artifacts
          merge-multiple: true

      - name: Create checksummed release assets and manifest
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          find desktop-release-artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' \) -print0 \
            | while IFS= read -r -d '' asset; do
                target="release-assets/$(basename "$asset")"
                test ! -e "$target" || { echo "Duplicate release asset filename: $target"; exit 1; }
                cp -- "$asset" "$target"
              done

          VERSION="${RELEASE_VERSION#v}"
          mv "$(find release-assets -maxdepth 1 -type f -name "*_${VERSION}_amd64.deb" -print -quit)" release-assets/AverQel-linux-amd64.deb
          mv "$(find release-assets -maxdepth 1 -type f -name "*_${VERSION}_x86_64.rpm" -print -quit)" release-assets/AverQel-linux-x86_64.rpm
          mv "$(find release-assets -maxdepth 1 -type f -name "*_${VERSION}_x64-setup.exe" -print -quit)" release-assets/AverQel-windows-x64.exe
          mv "$(find release-assets -maxdepth 1 -type f -name "*_${VERSION}_universal.dmg" -print -quit)" release-assets/AverQel-macos-universal.dmg
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4

          (cd release-assets && sha256sum *) > SHA256SUMS.txt
          python3 .github/scripts/create-release-manifest.py \
            --version "$RELEASE_VERSION" \
            --git-sha "$RELEASE_SHA" \
            --asset-dir release-assets \
            --output release-manifest.json \
            --base-url downloads/latest

      - name: Create GitHub release with desktop downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          name: AverQel ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*
            SHA256SUMS.txt
            release-manifest.json
          body: |
            # AverQel ${{ needs.prepare-release.outputs.version }}

            Production desktop release built from protected `main` commit `${{ needs.prepare-release.outputs.sha }}`.

            Git tag: `${{ needs.prepare-release.outputs.version }}`

            The generated changelog below is based on the merged pull requests and conventional commits included in this release.

            Desktop packages: `.deb`, `.rpm`, `.exe`, and universal macOS `.dmg`.

            Public downloads are published by the separate manual Docker/VPS deployment at:
            `https://averqel.com/downloads/latest/`

            Docker/VPS deployment is a separate manual workflow and is not started automatically.
