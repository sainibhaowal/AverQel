[mypy]
python_version = 3.12
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
plugins = pydantic.mypy
cache_dir = /home/ravi/.cache/averqel/mypy_cache
mypy_path = backend
files = backend
exclude = (^backend/alembic/versions/|^backend/scripts/)

[mypy-tests.*]
ignore_errors = true

[mypy-app.providers.services.lmstudio_provider]
