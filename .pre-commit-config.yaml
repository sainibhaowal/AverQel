# AverQel - auto runs before every git commit on LOCAL
# Install: pre-commit install (already done .git/hooks/pre-commit)
# Now `git commit` auto runs: ruff --fix, black, mypy, frontend lint, plus hygiene
# If hook fixes files, it blocks commit - re-add and commit again. All hooks run locally, code never leaves machine except pip-audit/safety (not enabled here).

repos:
  # --- basic file hygiene (fast, valuable) ---------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^(tests|docs|examples)/
      - id: trailing-whitespace
        exclude: ^(tests|docs|examples)/
      - id: end-of-file-fixer
        exclude: ^(tests|docs|examples)/
      - id: check-added-large-files
        args: [--maxkb=100]
        exclude: ^(tests|docs|examples)/
      - id: check-ast
        exclude: ^(tests|docs|examples)/
      - id: check-builtin-literals
        exclude: ^(tests|docs|examples)/
      - id: check-case-conflict
      - id: check-docstring-first
        exclude: ^(tests|docs|examples)/
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^(tests|docs|examples)/
      - id: detect-private-key
        exclude: ^(tests|docs|examples)/

  # --- secret scanning BLOCKING - catches .env.vps keys before commit -------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- modernize python 3.12 syntax (auto-fix) ------------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py312-plus]
        exclude: ^(tests|docs|examples)/

  # --- project-local tools (use project's own .venv, fast blocking) ---------
  - repo: local
    hooks:
      - id: backend-ruff-fix
        name: backend ruff --fix
        entry: bash -c "cd backend && ./.venv/bin/ruff check . --fix"
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: backend-black
        name: backend black
        entry: bash -c "cd backend && ./.venv/bin/black ."
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

      - id: backend-mypy
        name: backend mypy
        entry: bash -c "cd backend && ./.venv/bin/mypy ."
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend pnpm lint
        entry: bash -c "cd frontend && pnpm lint"
        language: system
        types: [file]
        files: ^frontend/
        pass_filenames: false
